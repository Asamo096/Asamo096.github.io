                    }
                    rect(g, x0 - 26, 68, bw + 52, 3, "#c4ced5");
                    // 玻璃幕墙
                    rect(g, x0, roofBottom, bw, WATER - roofBottom, "#d8ecf5");
                    for (let x = x0 + 10; x < x1 - 6; x += 28)
                        rect(
                            g,
                            x,
                            roofBottom + 4,
                            4,
                            WATER - roofBottom - 8,
                            "#9dc3d6",
                        );
                    rect(g, x0, roofBottom + 14, bw, 4, "#eaf6fb");
                    rect(g, x0 - 6, WATER - 5, bw + 12, 5, "#bcc6c4"); // 基座
                    // 倒影
                    g.globalAlpha = 0.26;
                    for (let x = x0; x <= x1; x += 3) {
                        const t = (x - x0) / bw;
                        const top = Math.round(72 - 40 * Math.sin(Math.PI * t));
                        rect(
                            g,
                            x,
                            WATER,
                            3,
                            Math.min(46, (WATER - top) * 0.62),
                            "#8fb6cb",
                        );
                    }
                    g.globalAlpha = 1;
                    // 水面涟漪（只落在水面上）
                    for (let i = 0; i < 90; i++) {
                        const x = 120 + rr() * (LIB_W - 240);
                        const top = waterTop(x) + 4;
                        rect(
                            g,
                            x,
                            top + rr() * Math.max(4, H - top - 8),
                            20 + rr() * 90,
                            1,
                            "rgba(255,255,255,.34)",
                        );
                    }

                    // 环湖步道（近岸）
                    rect(g, 0, H - 14, LIB_W, 14, "#cdb590");
                    rect(g, 0, H - 14, LIB_W, 2, "#e0cca9");
                    for (let x = 4; x < LIB_W; x += 22)
                        rect(g, x, H - 12, 1, 12, "#bda57f");

                    // 垂柳（左岸与右岸）
                    [330, 1420, 1660, 820].forEach((x) =>
                        drawWillow(g, x, H - 16, rr),
                    );
                    // 岸边灌木
                    [470, 1180, 1560].forEach((x) =>
                        atBase(g, x, H - 16, 1, (gg, ox, oy) =>
                            drawBush(gg, ox, oy, 1, rr),
                        ),
                    );

                    // 两端各加一片杨树/垂柳林，把湖湾的收口和画布边缘挡住，进入湖区时不突兀
                    const grove = [
                        6,
                        44,
                        82,
                        120,
                        158,
                        196,
                        234,
                        LIB_W - 240,
                        LIB_W - 202,
                        LIB_W - 164,
                        LIB_W - 126,
                        LIB_W - 88,
                        LIB_W - 50,
                        LIB_W - 12,
                    ];
                    grove.forEach((x, i) => {
                        const tall = rr() > 0.42;
                        if (rr() > 0.72) {
                            drawWillow(g, x, H - 16, rr);
                        } else {
                            atBase(g, x, H - 15, tall ? 2 : 1, (gg, ox, oy) =>
                                drawPoplar(gg, ox, oy, 1, rr),
                            );
                        }
                    });
                    // 树丛脚下的灌木，压住树根与湖岸的接缝
                    [
                        30,
                        90,
                        150,
                        210,
                        LIB_W - 220,
                        LIB_W - 160,
                        LIB_W - 100,
                        LIB_W - 40,
                    ].forEach((x) => {
                        atBase(g, x, H - 13, 1, (gg, ox, oy) =>
                            drawBush(gg, ox, oy, 1, rr),
                        );
                    });

                    libraryCanvas = cvs;
                }

                /** 垂柳：树干 + 下垂的柳条 */
                function drawWillow(g, x, baseY, rr) {
                    const h = 54;
                    rect(g, x - 2, baseY - h, 4, h, "#9c8a6a");
                    rect(g, x - 2, baseY - h, 1, h, "#7f6f52");
                    // 树冠
                    pixelCircle(g, x, baseY - h - 4, 18, "#7cb85f");
                    pixelCircle(g, x - 2, baseY - h - 8, 13, "#93cd76");
                    // 下垂柳条
                    for (let i = -5; i <= 5; i++) {
                        const lx = x + i * 3.6;
                        const len = 26 + ((i + 6) % 4) * 7;
                        rect(
                            g,
                            lx,
                            baseY - h + 2,
                            1,
                            len,
                            i % 2 === 0 ? "#84c266" : "#6fb055",
                        );
                    }
                    for (let i = 0; i < 16; i++) {
                        rect(
                            g,
                            x - 16 + rr() * 32,
                            baseY - h - 12 + rr() * 16,
                            2,
                            2,
                            "#a5d98b",
                        );
                    }
                }

                /* ---------------- 结局画面：黄昏版环湖图书馆（全屏） ---------------- */
                function buildDuskScene() {
                    const cvs = document.createElement("canvas");
                    cvs.width = VW;
                    cvs.height = VH;
                    const g = cvs.getContext("2d");
                    const rr = mulberry32(13579);
                    const HZ = 214; // 地平线

                    // 黄昏天空：由淡紫过渡到橙黄
                    const bands = [
                        "#b9a6cc",
                        "#c3a9c9",
                        "#cfaec2",
                        "#dcb4b6",
                        "#e8bca6",
                        "#f3c795",
                        "#fbd393",
                        "#ffdda2",
                    ];
                    const bh = Math.ceil(HZ / bands.length);
                    for (let i = 0; i < bands.length; i++)
                        rect(g, 0, i * bh, VW, bh, bands[i]);

                    // 低悬的夕阳与光晕（落在画面右侧，不被建筑遮挡）
                    const SUN_X = 492;
                    for (let r = 66; r > 0; r -= 6) {
                        g.globalAlpha = 0.05 + (66 - r) * 0.0016;
                        pixelCircle(g, SUN_X, HZ - 24, r, "#ffe6b0");
                    }
                    g.globalAlpha = 1;
                    pixelCircle(g, SUN_X, HZ - 24, 27, "#fff1c4");
                    pixelCircle(g, SUN_X, HZ - 24, 20, "#ffe08a");

                    // 远处树线剪影
                    for (let x = 0; x < VW; x += 5) {
                        const h =
                            8 +
                            Math.round(
                                5 * Math.sin(x * 0.05) +
                                    4 * Math.sin(x * 0.013),
                            );
                        rect(g, x, HZ - h, 5, h, "#9a8296");
                    }
                    // 湖面
                    rect(g, 0, HZ, VW, VH - HZ, "#c99a86");
                    for (let y = HZ; y < VH; y += 3) {
                        const a = (y - HZ) / (VH - HZ);
                        rect(
                            g,
                            0,
                            y,
                            VW,
                            3,
                            a < 0.35
                                ? "#d8a68c"
                                : a < 0.7
                                  ? "#c08f83"
                                  : "#a87d78",
                        );
                    }
                    for (let i = 0; i < 120; i++) {
                        rect(
                            g,
                            rr() * VW,
                            HZ + 4 + rr() * (VH - HZ - 6),
                            16 + rr() * 70,
                            1,
                            "rgba(255, 240, 210, .26)",
                        );
                    }

                    // 图书馆剪影（弧形屋顶 + 亮着的窗）—— 偏画面左侧，给夕阳让出位置
                    const bx = 36,
                        bw = 388,
                        x0 = bx,
                        x1 = bx + bw,
                        base = HZ - 2,
                        top0 = 132;
                    for (let x = x0 - 20; x <= x1 + 20; x++) {
                        const t = Math.max(
                            0,
                            Math.min(1, (x - (x0 - 20)) / (bw + 40)),
                        );
                        const top = Math.round(
                            top0 - 30 * Math.sin(Math.PI * t),
                        );
                        rect(g, x, top, 1, base - top, "#6f6270");
                    }
                    rect(g, x0, 164, bw, base - 164, "#5f5464");
                    for (let x = x0 + 12; x < x1 - 8; x += 30) {
                        for (let y = 170; y < base - 8; y += 18)
                            rect(g, x, y, 12, 9, "#ffd98a");
                    }
                    for (let x = x0 + 12; x < x1 - 8; x += 30)
                        rect(g, x, 164, 12, 6, "#e8b96a");
                    // 屋顶被夕阳照到的一道暖边
                    for (let x = x0 - 20; x <= x1 + 20; x++) {
                        const t = Math.max(
                            0,
                            Math.min(1, (x - (x0 - 20)) / (bw + 40)),
                        );
                        rect(
                            g,
                            x,
                            Math.round(top0 - 30 * Math.sin(Math.PI * t)),
                            1,
                            2,
                            "#b08a90",
                        );
                    }

                    // 建筑倒影（先压入水中，再用涟漪横向切开，读起来才像水面反射）
                    g.globalAlpha = 0.32;
                    for (let x = x0; x <= x1; x += 3) {
                        const t = (x - x0) / bw;
                        const top = Math.round(
                            top0 - 30 * Math.sin(Math.PI * t),
                        );
                        rect(
                            g,
                            x,
                            HZ,
                            3,
                            Math.min(46, (HZ - top) * 0.55),
                            "#7a5f68",
                        );
                    }
                    g.globalAlpha = 1;
                    for (let y = HZ + 2; y < HZ + 56; y += 4) {
                        rect(
                            g,
                            x0 - 10,
                            y,
                            bw + 20,
                            2,
                            "rgba(200, 150, 134, .75)",
                        );
                    }
                    for (let i = 0; i < 26; i++) {
                        rect(
                            g,
                            x0 - 20 + rr() * (bw + 40),
                            HZ + 2 + rr() * 52,
                            14 + rr() * 40,
                            1,
                            "rgba(255, 236, 210, .4)",
                        );
                    }

                    // 夕阳在水面的光路
                    for (let y = HZ; y < VH - 18; y += 2) {
                        const w = 26 + (y - HZ) * 1.7;
                        rect(
                            g,
                            SUN_X - w / 2 + (rr() - 0.5) * 12,
                            y,
                            w,
                            1,
                            "rgba(255, 228, 168, .55)",
                        );
                    }

                    // 岸边垂柳剪影（左右两侧，框住画面）
                    [18, 62, 556, 612].forEach((x, i) => {
                        const h = 52 + i * 3,
                            baseY = HZ + 2;
                        rect(g, x - 2, baseY - h, 4, h, "#7a6a72");
                        pixelCircle(g, x, baseY - h - 4, 17, "#6f6270");
                        for (let k = -5; k <= 5; k++)
                            rect(
                                g,
                                x + k * 3.5,
                                baseY - h + 2,
                                1,
                                24 + ((k + 6) % 4) * 6,
                                "#6a5e69",
                            );
                    });
                    // 近岸暗色前景
                    rect(g, 0, VH - 26, VW, 26, "#8a6f74");
                    rect(g, 0, VH - 26, VW, 2, "#a2868a");
                    rect(g, 0, VH - 26, VW, 1, "#b09397");
                    // 柔和光晕
                    for (let r = 160; r > 0; r -= 10) {
                        g.globalAlpha = 0.018;
                        pixelCircle(g, SUN_X, HZ - 20, r, "#ffdda2");
                    }
                    g.globalAlpha = 1;

                    duskCanvas = cvs;
                }

                /* =====================================================================
   7. 游戏状态
   ===================================================================== */
                const canvas = document.getElementById("game");
                const g = canvas.getContext("2d");
                g.imageSmoothingEnabled = false;

                const uiEl = document.getElementById("ui");
                const tagsEl = document.getElementById("tags");
                const dialogEl = document.getElementById("dialog");
                const dlgNameEl = document.getElementById("dlg-name");
                const dlgTextEl = document.getElementById("dlg-text");
                const hudEl = document.getElementById("hud");
                const hudNumEl = document.getElementById("hud-num");
                const hudPipsEl = document.getElementById("hud-pips");
                const titleEl = document.getElementById("title");
                const endingEl = document.getElementById("ending");

                /** 玩家状态 */
                const player = {
                    x: 140,
                    vx: 0,
                    facing: 1,
                    animT: 0,
                    stepT: 0,
                    moving: false,
                };

                /** 镜头 */
                const camera = { x: 0 };

                /** NPC 实例（运行时状态） */
                const npcs = NPC_DATA.map((d, i) => ({
                    ...d,
                    index: i,
                    seen: false,
                    talked: false, // 是否已经聊完（聊完才揭示对应的活动展板）
                    locked: false, // 已触发但玩家尚未走远
                    facing: -1,
                    breathe: Math.random() * Math.PI * 2,
                }));

                /** 云朵（会缓缓飘动） */
                const CLOUD_SPAN = 2400;
                const cloudSprites = [
                    makeCloudSprite(1.6),
                    makeCloudSprite(2.4),
                    makeCloudSprite(3.4),
                ];
                const clouds = [];
                (function () {
                    const rr = mulberry32(31415);
                    for (let i = 0; i < 11; i++) {
                        const idx = i % 3;
                        clouds.push({
                            x: rr() * CLOUD_SPAN,
                            y: 14 + rr() * 104,
                            spd: 4 + rr() * 9,
                            spr: cloudSprites[idx],
                            depth: 0.26 + idx * 0.07,
                        });
                    }
                })();

                /** 全局状态机：title（标题）/ play（探索）/ dialog（对话）/ ending（结局） */
                let state = "title";
                let seenCount = 0;
                let endingT = 0;
                let clock = 0;
                const keys = Object.create(null);

                /* =====================================================================
   8. 更新逻辑
   ===================================================================== */
                function update(dt) {
                    clock += dt;

                    galTick(dt); // Galgame 打字机（独立于游戏状态，切帧率也稳定）

                    // 云朵永远在飘（标题页也有生气）
                    for (const c of clouds) {
                        c.x -= c.spd * dt;
                        if (c.x < -60) c.x += CLOUD_SPAN;
                    }

                    // NPC 呼吸起伏与自动转头看向玩家
                    for (const n of npcs) {
                        n.breathe += dt;
                        n.facing = player.x < n.x ? -1 : 1;
                    }

                    if (state === "ending") {
                        endingT += dt;
                        return;
                    }
                    if (state !== "play" && state !== "toast") return; // 提示气泡期间仍可继续走动

                    /* ---------- 左右移动：带加速度与摩擦，手感顺滑 ---------- */
                    let dir = 0;
                    if (keys.ArrowLeft || keys.KeyA) dir -= 1;
                    if (keys.ArrowRight || keys.KeyD) dir += 1;

                    if (dir !== 0) {
                        player.vx += dir * ACCEL * dt;
                        player.vx = clamp(player.vx, -SPEED, SPEED);
                        player.facing = dir > 0 ? 1 : -1;
                    } else {
                        // 松手后平滑减速
                        const f = FRICTION * dt;
                        if (Math.abs(player.vx) <= f) player.vx = 0;
                        else player.vx -= Math.sign(player.vx) * f;
                    }
                    player.x = clamp(
                        player.x + player.vx * dt,
                        PLAYER_MIN_X,
                        PLAYER_MAX_X,
                    );

                    /* ---------- 走路动画 + 脚步声 ---------- */
                    player.moving = Math.abs(player.vx) > 12;
                    if (player.moving) {
                        player.animT += dt;
                        player.stepT += dt;
                        if (player.stepT >= STEP_INTERVAL) {
                            player.stepT = 0;
                            Sound.step();
                        }
                    } else {
                        player.animT = 0;
                        player.stepT = STEP_INTERVAL; // 停步后立刻就能踏出下一步
                    }

                    /* ---------- 镜头跟随（带死区，标准横版手感） ---------- */
                    const camTarget = clamp(
                        player.x - VW * 0.44,
                        0,
                        WORLD_W - VW,
                    );
                    camera.x += (camTarget - camera.x) * Math.min(1, dt * 9);
                    // 防止玩家冲出画面
                    if (player.x > camera.x + VW - 56)
                        camera.x = player.x - (VW - 56);
                    if (player.x < camera.x + 56) camera.x = player.x - 56;
                    camera.x = clamp(camera.x, 0, WORLD_W - VW);

                    /* ---------- 靠近 NPC 自动触发剧情（第一位部长进入 Galgame 问答） ---------- */
                    for (const n of npcs) {
                        const d = Math.abs(player.x - n.x);
                        if (d < NPC_TRIGGER && !n.locked) {
                            if (n.kind === "gal") openGal(n);
                            else openDialog(n);
                            return;
                        }
                        if (d > NPC_RELEASE) n.locked = false;
                    }

                    /* ---------- 抵达终点，触发结局彩蛋 ---------- */
                    if (player.x >= END_TRIGGER_X) triggerEnding();
                }

                /* =====================================================================
   9. 渲染
   ===================================================================== */
                function render() {
                    const camX = Math.round(camera.x);

                    /* ---- 天空：分段色带，营造清爽的像素渐变 ---- */
                    const skyBands = [
                        "#bfe3fb",
                        "#c9e8fc",
                        "#d4edfd",
                        "#dff2fe",
                        "#e9f7ff",
                        "#f3fbff",
                    ];
                    const bandH = Math.ceil(HORIZON / skyBands.length);
                    for (let i = 0; i < skyBands.length; i++) {
                        rect(g, 0, i * bandH, VW, bandH, skyBands[i]);
                    }

                    /* ---- 暖阳（右上角，柔和治愈） ---- */
                    pixelCircle(g, 546, 56, 22, "rgba(255, 246, 205, .55)");
                    pixelCircle(g, 546, 56, 15, "#fff0b8");
                    pixelCircle(g, 546, 56, 11, "#ffe38c");

                    /* ---- 云朵（视差缓缓飘动） ---- */
                    for (const c of clouds) {
                        let sx = c.x - camX * c.depth;
                        sx = ((sx % CLOUD_SPAN) + CLOUD_SPAN) % CLOUD_SPAN;
                        const w = c.spr.width;
                        const baseX = Math.round(sx) - w;
                        const yy = Math.round(c.y);
                        if (baseX + w > -40 && baseX < VW + 40)
                            g.drawImage(c.spr, baseX, yy);
                        // 另一份用于接缝处无缝衔接
                        const altX = baseX + CLOUD_SPAN;
                        if (altX < VW + 40) g.drawImage(c.spr, altX, yy);
                    }

                    /* ---- 远景层：松嫩平原 + 校园航拍全景（视差最慢，可无缝平铺） ---- */
                    drawTiled(farCanvas, camX * PAR_FAR, FAR_TOP);

                    /* ---- 中景层：中距离林带与低矮校舍（视差居中，可无缝平铺） ---- */
                    drawTiled(midCanvas, camX * PAR_MID, MID_TOP);

                    /* ---- 中景地标：前段拱门主教学楼，后段环湖图书馆（随推进依次切换） ---- */
                    // 两座地标在世界坐标上各自成段，前后衔接自然
                    drawLandmark(archCanvas, ARCH_X, ARCH_H);
                    drawLandmark(libraryCanvas, LIB_X, LIB_H);

                    /* ---- 近景层：草地、人行道与装饰物（预渲染贴图，按镜头横向裁切一次 drawImage 完成） ---- */
                    if (groundCanvas) {
                        g.drawImage(
                            groundCanvas,
                            camX,
                            0,
                            VW,
                            VH - GROUND_TOP,
                            0,
                            GROUND_TOP,
                            VW,
                            VH - GROUND_TOP,
                        );
                    }
                    if (sceneryCanvas) {
                        g.drawImage(
                            sceneryCanvas,
                            camX,
                            0,
                            VW,
                            VH - SCENERY_TOP,
                            0,
                            SCENERY_TOP,
                            VW,
                            VH - SCENERY_TOP,
                        );
                    }

                    /* ---- 角色：先画 NPC，再画玩家 ---- */
                    for (const n of npcs) {
                        const sx = n.x - camX;
                        if (sx < -60 || sx > VW + 60) continue;
                        const breathe =
                            Math.round((Math.sin(n.breathe * 1.6) + 1) * 0.5) -
                            1; // 轻微呼吸感
                        const pose = Object.assign({}, POSE_IDLE, {
                            bob: breathe,
                        });
                        drawCharacter(g, sx, GROUND_Y, n, pose, n.facing);
                        if (!n.seen)
                            drawExclaim(
                                g,
                                sx,
                                GROUND_Y - 27 * CHAR_SCALE,
                                clock + n.index,
                            );
                    }

                    const psx = player.x - camX;
                    const walkIdx =
                        Math.floor(player.animT / WALK_FRAME_TIME) % 4;
                    const ppose = player.moving
                        ? POSES_WALK[walkIdx]
                        : POSE_IDLE;
                    drawCharacter(
                        g,
                        psx,
                        GROUND_Y,
                        PLAYER_SKIN_C,
                        ppose,
                        player.facing,
                    );

                    /* ---- 结局：白闪后淡入黄昏环湖图书馆 ---- */
                    if (state === "ending") {
                        if (endingT < 0.62) {
                            const t = endingT;
                            const a =
                                t < 0.16
                                    ? t / 0.16
                                    : Math.max(0, 1 - (t - 0.16) / 0.46);
                            g.fillStyle =
                                "rgba(255, 255, 255, " +
                                (a * 0.94).toFixed(3) +
                                ")";
                            g.fillRect(0, 0, VW, VH);
                        }
                        if (duskCanvas && endingT > 0.35) {
                            g.globalAlpha = Math.min(1, (endingT - 0.35) / 0.9);
                            g.drawImage(duskCanvas, 0, 0);
                            g.globalAlpha = 1;
                        }
                    }
                }

                /** 横向无缝平铺贴图（offset 为视差后的滚动量） */
                function drawTiled(img, offset, top) {
                    if (!img) return;
                    const w = img.width;
                    const start = -(((offset % w) + w) % w);
                    for (let x = start; x < VW; x += w)
                        g.drawImage(img, Math.round(x), top);
                }

                /** 地标贴图：底边对齐地平线，随镜头横向平移（滑入滑出画面，无需切换动画） */
                function drawLandmark(img, worldX, h) {
                    if (!img) return;
                    const left = Math.round(worldX - camera.x);
                    if (left > VW || left + img.width < 0) return; // 完全在画面外
                    g.drawImage(img, left, HORIZON - h);
                }

                /* =====================================================================
   10. Galgame 问答界面（组织部部长）
   —— 立绘占位框完全由 CSS 的 box-shadow 拼出，不引入任何图片
   —— 对话文本与提问选项走 DOM，支持鼠标点击与键盘操作
   ===================================================================== */

                /* 24 x 30 的角色立绘像素图：'.' 透明，字母对应下面的调色板 */
                const PORTRAIT_ROWS = [
                    "........HHHHHHHH........",
                    "......HHHHHHHHHHHH......",
                    ".....HHHHHHHHHHHHHH.....",
                    "....HHHHHHHHHHHHHHHH....",
                    "...HHHHHHHHHHHHHHHHHH...",
                    "...HHhhhhhhhhhhhhhhHH...",
                    "...HHSSSSSSSSSSSSSSHH...",
                    "...HHSSSSSSSSSSSSSSHH...",
                    "...HHSSEESSSSSSEESSHH...",
                    "...HHSSEESSSSSSEESSHH...",
                    "...HHSSSSSSSSSSSSSSHH...",
                    "...HHSSSSSSMMSSSSSSHH...",
                    "...HHSSSSSSSSSSSSSSHH...",
                    "....SSSSSSSSSSSSSSSS....",
                    ".....SSSSSSSSSSSSSS.....",
                    ".......SSSSSSSSSS.......",
                    "........SSSSSSSS........",
                    "......WWWWWWWWWWWW......",
                    "....WWWWWWWWWWWWWWWW....",
                    "..WWWWWWWWWWWWWWWWWWWW..",
                    "..WWWWWWCCCCCCCCWWWWWW..",
                    "..WWWWWWWWCCCCWWWWWWWW..",
                    "..WWWWWWWWWCCWWWWWWWWW..",
                    "..WWWWWWWBBWWWWWWWWWWW..",
                    "..WWWWWWBBBBWWWWWWWWWW..",
                    "..WWWWWWWBBWWWWWWWWWWW..",
                    "..WWWWWWWWWWWWWWWWWWWW..",
                    "..wwWWWWWWWWWWWWWWWWww..",
                    "..wwwWWWWWWWWWWWWWWwww..",
                    "..wwwwwwwwwwwwwwwwwwww..",
                ];
                const PORTRAIT_PALETTE = {
                    H: (c) => c.hairColor, // 头发
                    h: (c) => shade(c.hairColor, 0.42), // 发丝高光
                    S: (c) => c.skin, // 皮肤
                    E: () => "#3a3230", // 眼睛
                    M: () => "#c98a80", // 嘴
                    W: (c) => c.shirt, // 上衣
                    w: (c) => shade(c.shirt, -0.18), // 袖子 / 衣服阴影
                    C: () => "#ffffff", // 衣领
                    B: (c) => c.badge, // 领带 / 徽章
                };

                const galEl = document.getElementById("gal");
                const galPxEl = document.getElementById("gal-px");
                const galDialogEl = document.getElementById("gal-dialog");
                const galNameEl = document.getElementById("gal-name");
                const galTextEl = document.getElementById("gal-text");
                const galOptsEl = document.getElementById("gal-options");
                const galSkipEl = document.getElementById("gal-skip");
                const galExitEl = document.getElementById("gal-exit");

                const GAL_TYPE_CHAR = 0.02; // 打字机速度：每个字用时（秒）

                const gal = {
                    open: false,
                    typing: false,
                    acc: 0, // 打字机累计时间
                    shown: 0, // 已显示字数
                    full: "",
                    after: null,
                    npc: null, // 当前对话的 NPC
                    sel: -1, // -1 表示当前没有高亮项（避免误按回车直接选中）
                    answered: new Set(),
                };

                /** 用 box-shadow 把像素图画进占位框（每个像素是一个 1em 方块） */
                function buildPortrait() {
                    const c = NPC_DATA[0];
                    const shadows = [];
                    PORTRAIT_ROWS.forEach((row, y) => {
                        for (let x = 0; x < row.length; x++) {
                            const colorOf = PORTRAIT_PALETTE[row[x]];
                            if (!colorOf) continue;
                            shadows.push(
                                x + "em " + y + "em 0 0 " + colorOf(c),
                            );
                        }
                    });
                    galPxEl.style.boxShadow = shadows.join(",");
                }

                /** 打字机式显示文本，显示完成后执行 after 回调（由主循环按 dt 驱动，帧率无关） */
                function galSetText(text, after) {
                    gal.full = text;
                    gal.after = after || null;
                    gal.typing = true;
                    gal.acc = 0;
                    gal.shown = 0;
                    galTextEl.textContent = "";
                    galSkipEl.classList.add("on");
                }
                function galTick(dt) {
                    if (!gal.typing) return;
                    gal.acc += dt;
                    const want = Math.min(
                        gal.full.length,
                        Math.floor(gal.acc / GAL_TYPE_CHAR),
                    );
                    if (want !== gal.shown) {
                        gal.shown = want;
                        galTextEl.textContent = gal.full.slice(0, want);
                    }
                    if (want >= gal.full.length) galFinishTyping();
                }
                function galFinishTyping() {
                    if (!gal.typing) return;
                    gal.typing = false;
                    gal.shown = gal.full.length;
                    galTextEl.textContent = gal.full;
                    galSkipEl.classList.remove("on");
                    const cb = gal.after;
                    gal.after = null;
                    if (cb) cb();
                }
                /** 点击文字 / 按空格：立即显示完整台词 */
                function galSkip() {
                    if (gal.typing) galFinishTyping();
                }

                /** 弹出全部提问选项（回答结束后再次调用） */
                function galRenderOptions() {
                    galOptsEl.textContent = "";
                    GAL_OPTIONS.forEach((opt, i) => {
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "gal-opt";
                        if (gal.answered.has(i)) btn.classList.add("done"); // 已问过的问题打个勾
                        const num = document.createElement("span");
                        num.className = "num";
                        num.textContent = i + 1 + ".";
                        const qt = document.createElement("span");
                        qt.className = "qt";
                        qt.textContent = opt.q;
                        btn.appendChild(num);
                        btn.appendChild(qt);
                        btn.addEventListener("click", () => galPick(i));
                        galOptsEl.appendChild(btn);
                    });
                    gal.sel = -1;
                    galHighlight();
                    galEl.classList.add("opts");
                }
                function galHighlight() {
                    const btns = galOptsEl.children;
                    for (let i = 0; i < btns.length; i++)
                        btns[i].classList.toggle("sel", i === gal.sel);
                }
                /** 键盘上下选择提问 */
                function galNav(d) {
                    const n = galOptsEl.children.length;
                    if (!n) return;
                    if (gal.sel < 0) gal.sel = d > 0 ? 0 : n - 1;
                    else gal.sel = (gal.sel + d + n) % n;
                    galHighlight();
                    Sound.step();
                }
                function galConfirm() {
                    if (gal.typing) {
                        galSkip();
                        return;
                    }
                    if (gal.sel >= 0 && gal.sel < galOptsEl.children.length)
                        galPick(gal.sel);
                }
                /** 选择某个提问：选项消失 → 播放部长回答 → 回答结束重新弹出全部选项 */
                function galPick(i) {
                    const opt = GAL_OPTIONS[i];
                    if (!opt || gal.typing) return;
                    gal.answered.add(i);
                    galOptsEl.textContent = ""; // 选项消失
                    gal.sel = -1;
                    galEl.classList.remove("opts");
                    Sound.talk();
                    galSetText(opt.a, galRenderOptions); // 文本展示完成后重新弹出全部提问
                }

                function openGal(npc) {
                    gal.open = true;
                    gal.npc = npc;
                    npc.locked = true;
                    if (!npc.seen) {
                        npc.seen = true;
                        seenCount++;
                        refreshHud();
                    }
                    state = "galgame";

                    galNameEl.textContent = npc.name;
                    galNameEl.style.setProperty("--c", npc.shirt);
                    galTextEl.textContent = "";
                    galOptsEl.textContent = "";
                    galEl.classList.remove("opts");
                    galEl.classList.add("on");
                    void galEl.offsetWidth; // 触发重排，让淡入动画生效
                    galEl.classList.add("show");
                    hudEl.style.opacity = "0";
                    tags.forEach((t) => t.el.classList.remove("on"));

                    Sound.talk();
                    Sound.bgmDuck(true);
                    galSetText(GAL_GREETING, galRenderOptions); // 开场引导台词 → 弹出提问选项
                }

                function closeGal() {
                    if (!gal.open) return; // 只有问答界面真的开着时才处理
                    gal.typing = false;
                    gal.after = null;
                    gal.open = false;
                    if (gal.npc) {
                        gal.npc.talked = true;
                        gal.npc = null;
                    }
                    galEl.classList.remove("show", "opts");
                    setTimeout(() => {
                        if (!gal.open) galEl.classList.remove("on");
                    }, 320);
                    hudEl.style.opacity = "";
                    state = "play";
                    Sound.close();
                    Sound.bgmDuck(false);
                }

                galDialogEl.addEventListener("click", galSkip); // 点击对话框可跳过打字
                galExitEl.addEventListener("click", (e) => {
                    e.stopPropagation();
                    closeGal();
                });

                /* =====================================================================
   11. 活动展板（群像背景）与照片画框
   —— 第 2~4 位 NPC 各配一块展板，场景全部用 CSS 矩形拼出（无脸群像 + 项目道具）
   —— 展板悬在人物头顶上方，不会遮挡角色，也不触发对话
   —— 点击展板弹出照片画框；照片文件放到与本网页相同的目录即可替换
   ===================================================================== */

                /* 展板配置：x 对应 NPC 所在位置，npcIndex 对应 NPC_DATA，file 为照片占位文件名（换成你的文件名即可） */
                const BOOTHS = [
                    {
                        x: 1560,
                        npcIndex: 1,
                        title: "辩论赛",
                        kind: "debate",
                        file: "photo-debate.jpg",
                    },
                    {
                        x: 2320,
                        npcIndex: 2,
                        title: "乒乓球比赛",
                        kind: "pingpong",
                        file: "photo-pingpong.jpg",
                    },
                    {
                        x: 3080,
                        npcIndex: 3,
                        title: "羽毛球比赛",
                        kind: "badminton",
                        file: "photo-badminton.jpg",
                    },
                ];

                /* 群像配色（只画头与身体，不画五官，因此可复用大量随机人物） */
                const CROWD_SKIN = ["#ffdcbb", "#ffe1c6", "#f6c9a0", "#e8b98f"];
                const CROWD_SHIRT = [
                    "#8fd3f4",
                    "#ffc48f",
                    "#c9e88f",
                    "#ffd9a0",
                    "#b8c9f0",
                    "#f0a8b8",
                    "#9fdcc4",
                    "#d8c8f0",
                ];

                /** 单个「无脸」人物：按身高推算身体宽窄（约 1:3.4），只有剪影不画五官 */
                function figure(x, baseY, h, skin, shirt, pants) {
                    const w = Math.min(9, Math.max(3, Math.round(h / 3.4)));
                    const headH = Math.min(
                        8,
                        Math.max(3, Math.round(h * 0.28)),
                    );
                    const legH = Math.min(9, Math.max(2, Math.round(h * 0.28)));
                    const legW = Math.max(1, Math.round(w * 0.34));
                    const gap = Math.max(1, w - legW * 2);
                    const leg = pants || "#5b6472";
                    return [
                        [x, baseY - h, w, headH, skin], // 头
                        [x, baseY - h + headH, w, h - headH - legH, shirt], // 上身
                        [x, baseY - legH, legW, legH, leg], // 左腿
                        [x + legW + gap, baseY - legH, legW, legH, leg], // 右腿
                    ];
                }

                /** 一排「无脸」群像观众 */
                function crowdRow(rr, x0, x1, baseY, minH, maxH, step) {
                    const out = [];
                    for (let x = x0; x < x1; x += step + Math.floor(rr() * 3)) {
                        const h = minH + Math.floor(rr() * (maxH - minH + 1));
                        out.push(
                            ...figure(
                                x,
                                baseY,
                                h,
                                CROWD_SKIN[
                                    Math.floor(rr() * CROWD_SKIN.length)
                                ],
                                CROWD_SHIRT[
                                    Math.floor(rr() * CROWD_SHIRT.length)
                                ],
                            ),
                        );
                    }
                    return out;
                }

                /** 展板场景的所有矩形块：[x, y, 宽, 高, 颜色]，单位为「格」，1 格 = 2 逻辑像素（共 140 x 46 格） */
                function sceneRects(kind) {
                    const rr = mulberry32(
                        { debate: 4021, pingpong: 5077, badminton: 6133 }[kind],
                    );
                    const R = [];
                    const W = 140,
                        F = 46;

                    if (kind === "debate") {
                        /* ---------- 辩论赛：横幅 + 观众 + 舞台 + 正反方讲台与辩手 ---------- */
                        R.push([0, 0, W, 6, "#2f5d8a"]); // 顶部横幅
                        R.push([8, 1, W - 16, 3, "#f4f8ff"]);
                        R.push([0, 6, W, 20, "#eaf2fb"]); // 背板
                        R.push(...crowdRow(rr, 2, W - 2, 26, 10, 13, 6)); // 观众群像
                        R.push([0, 26, W, 2, "#e0c194"]); // 台口高光
                        R.push([0, 28, W, 14, "#c9a06a"]); // 舞台台面
                        for (let x = 6; x < W; x += 12)
                            R.push([x, 28, 1, 14, "#bb9160"]); // 木板缝
                        R.push([0, 42, W, F - 42, "#8a6b4a"]); // 台前立面
                        R.push(...figure(13, 44, 32, "#ffe1c6", "#3d7fb8")); // 正方辩手
                        R.push(...figure(25, 44, 30, "#ffdcbb", "#5aa0d8"));
                        R.push(...figure(97, 44, 32, "#ffe6cf", "#c9695a")); // 反方辩手
                        R.push(...figure(109, 44, 30, "#ffdcbb", "#e0806f"));
                        R.push(...figure(63, 44, 36, "#ffe1c6", "#8a7fb8")); // 主持人
                        R.push([54, 32, 32, 12, "#b08a5a"]); // 主持台
                        R.push([54, 32, 32, 2, "#cfa678"]);
                        R.push([8, 22, 22, 22, "#3d7fb8"]); // 正方讲台
                        R.push([8, 22, 22, 4, "#5aa0d8"]);
                        R.push([110, 22, 22, 22, "#c9695a"]); // 反方讲台
                        R.push([110, 22, 22, 4, "#e0806f"]);
                    } else if (kind === "pingpong") {
                        /* ---------- 乒乓球比赛：场馆 + 观众 + 球台球网 + 两名选手 ---------- */
                        R.push([0, 0, W, 5, "#dbe9f2"]);
                        R.push([0, 5, W, 16, "#e9f3ec"]);
                        R.push([0, 21, W, 5, "#cfe0d2"]); // 墙裙
                        R.push(...crowdRow(rr, 2, W - 2, 26, 10, 13, 6));
                        R.push([0, 26, W, F - 26, "#2f7a52"]); // 场地
                        R.push([0, 26, W, 1, "#f4f9f4"]); // 边线
                        R.push([69, 27, 2, F - 27, "#f4f9f4"]); // 中线
                        R.push(...figure(24, 44, 30, "#ffe1c6", "#e05a5a")); // 左选手
                        R.push(...figure(106, 44, 30, "#ffdcbb", "#4a7fd0")); // 右选手
                        R.push([46, 32, 48, 10, "#2f6f9e"]); // 球台
                        R.push([46, 32, 48, 1, "#5fa0cc"]);
                        R.push([46, 42, 48, 1, "#22547a"]);
                        R.push([52, 42, 3, 4, "#22547a"]); // 桌腿
                        R.push([85, 42, 3, 4, "#22547a"]);
                        R.push([66, 24, 8, 18, "#f2f6ef"]); // 球网
                        R.push([66, 24, 1, 18, "#b9c2c9"]);
                        R.push([73, 24, 1, 18, "#b9c2c9"]);
                        R.push([36, 32, 7, 7, "#c0392b"]); // 左球拍
                        R.push([97, 31, 7, 7, "#2f3b46"]); // 右球拍
                        R.push([72, 20, 3, 3, "#ffffff"]); // 球
                    } else {
                        /* ---------- 羽毛球比赛：场馆 + 观众 + 球网 + 两名选手 ---------- */
                        R.push([0, 0, W, 5, "#dbe9f2"]);
                        R.push([0, 5, W, 16, "#eaf1fa"]);
                        R.push([0, 21, W, 5, "#cfd9e6"]);
                        R.push(...crowdRow(rr, 2, W - 2, 26, 10, 13, 6));
                        R.push([0, 26, W, F - 26, "#3f7fbf"]); // 场地
                        R.push([0, 26, W, 1, "#ffffff"]);
                        R.push([69, 27, 2, F - 27, "#ffffff"]); // 中线
                        R.push([14, 27, 1, F - 27, "#ffffff"]); // 边线
                        R.push([125, 27, 1, F - 27, "#ffffff"]);
                        R.push(...figure(26, 44, 30, "#ffe6cf", "#f2c14e")); // 左选手
                        R.push(...figure(102, 44, 30, "#ffdcbb", "#7ec8f0")); // 右选手
                        R.push([64, 22, 12, 22, "#f2f6ef"]); // 球网
                        R.push([64, 22, 12, 1, "#ffffff"]); // 网上白带
                        R.push([63, 20, 1, 24, "#b9c2c9"]); // 网柱
                        R.push([75, 20, 1, 24, "#b9c2c9"]);
                        R.push([36, 30, 7, 9, "#e8e8e8"]); // 左球拍
                        R.push([38, 39, 2, 4, "#8a6b4a"]);
                        R.push([95, 29, 7, 9, "#e8e8e8"]); // 右球拍
                        R.push([97, 38, 2, 4, "#8a6b4a"]);
                        R.push([80, 14, 4, 4, "#ffffff"]); // 羽毛球
                        R.push([81, 18, 1, 1, "#d8d8d8"]);
                    }
                    return R;
                }

                const boothsEl = document.getElementById("booths");
                const photoEl = document.getElementById("photo");
                const photoFrameEl = document.getElementById("photo-frame");
                const photoImgEl = document.getElementById("photo-img");

                /* 图片显示区域上限（逻辑像素）：相框按图片真实比例贴合，不留空白 */
                const PHOTO_MAX_W = 556;
                const PHOTO_MAX_H = 258;
                const photoTitleEl = document.getElementById("photo-title");
                const photoFileEl = document.getElementById("photo-file");
                const photoHoldEl = document.getElementById("photo-hold");

                const booths = [];

                /** 把每块展板渲染成 DOM */
                function buildBooths() {
                    BOOTHS.forEach((b) => {
                        const el = document.createElement("div");
                        el.className = "booth";

                        const frame = document.createElement("div");
                        frame.className = "booth-frame";

                        const scene = document.createElement("div");
                        scene.className = "booth-scene";
                        sceneRects(b.kind).forEach((r) => {
                            const d = document.createElement("div");
                            d.className = "booth-px";
                            d.style.left = r[0] + "em";
                            d.style.top = r[1] + "em";
                            d.style.width = r[2] + "em";
                            d.style.height = r[3] + "em";
                            d.style.background = r[4];
                            scene.appendChild(d);
                        });
                        frame.appendChild(scene);

                        const cap = document.createElement("div");
                        cap.className = "booth-cap";
                        const nameEl = document.createElement("span");
                        nameEl.textContent = b.title;
                        const tipEl = document.createElement("span");
                        tipEl.className = "tip";
                        tipEl.textContent = "点击查看照片 ▸";
                        cap.appendChild(nameEl);
                        cap.appendChild(tipEl);
                        frame.appendChild(cap);

                        el.appendChild(frame);
                        el.addEventListener("click", () => openPhoto(b));
                        boothsEl.appendChild(el);
                        // y 为展板底边，正好落在名牌上方
                        booths.push({
                            el,
                            x: b.x,
                            y: 186,
                            npcIndex: b.npcIndex,
                            data: b,
                        });
                    });
                }

                /** 展板随镜头平移；只有跟对应 NPC 聊完之后才会揭示出来 */
                function updateBooths() {
                    const visible = state === "play" || state === "toast";
                    for (const b of booths) {
                        const sx = ((b.x - camera.x) / VW) * 100;
                        const npc = npcs[b.npcIndex];
                        const unlocked = !!(npc && npc.talked);
                        b.el.style.left = sx + "%";
                        b.el.style.top = (b.y / VH) * 100 + "%";
                        b.el.classList.toggle(
                            "on",
                            visible && unlocked && sx > -22 && sx < 122,
                        );
                    }
                }

                /* ---------- 照片画框 ---------- */

                /** 恢复默认相框尺寸，换图时先清掉上一张留下的尺寸 */
                function resetPhotoFrame() {
                    photoFrameEl.style.width = "";
                    photoFrameEl.style.height = "";
                }

                /** 按图片真实宽高比计算相框尺寸：上限内尽量放大，并完全贴合图片 */
                function fitPhotoFrame() {
                    const nw = photoImgEl.naturalWidth;
                    const nh = photoImgEl.naturalHeight;
                    if (!nw || !nh) return;
                    const k = Math.min(PHOTO_MAX_W / nw, PHOTO_MAX_H / nh);
                    const w = Math.max(1, Math.round(nw * k));
                    const h = Math.max(1, Math.round(nh * k));
                    photoFrameEl.style.width = "calc(var(--s) * " + w + "px)";
                    photoFrameEl.style.height = "calc(var(--s) * " + h + "px)";
                }

                function openPhoto(b) {
                    if (state !== "play" && state !== "toast") return;
                    state = "photo";
                    photoTitleEl.textContent = b.title;
                    photoFileEl.textContent = b.file;
                    photoHoldEl.classList.remove("hide");
                    resetPhotoFrame();
                    photoImgEl.onload = () => {
                        photoHoldEl.classList.add("hide");
                        fitPhotoFrame();
                    };
                    photoImgEl.onerror = () =>
                        photoHoldEl.classList.remove("hide");
                    photoImgEl.src = b.file;
                    // 图片已在缓存中时不会再触发 onload，这里补一次判断
                    if (photoImgEl.complete && photoImgEl.naturalWidth > 0) {
                        photoHoldEl.classList.add("hide");
                        fitPhotoFrame();
                    }
                    photoEl.classList.add("on");
                    void photoEl.offsetWidth;
                    photoEl.classList.add("show");
                    Sound.talk();
                }
                function closePhoto() {
                    if (state !== "photo") return;
                    state = "play";
                    photoEl.classList.remove("show");
                    setTimeout(() => {
                        if (state !== "photo") photoEl.classList.remove("on");
                    }, 260);
                    Sound.close();
                }
                photoEl.addEventListener("click", closePhoto);

                /* =====================================================================
   12. 输入、界面联动与主循环
   ===================================================================== */

                /* ---------------- 自适应缩放 ---------------- */
                function resize() {
                    const w = window.innerWidth,
                        h = window.innerHeight;
                    const scale = Math.min(w / VW, h / VH);
                    const dw = Math.max(1, Math.round(VW * scale));
                    const dh = Math.max(1, Math.round(VH * scale));
                    canvas.style.width = dw + "px";
                    canvas.style.height = dh + "px";

                    const r = canvas.getBoundingClientRect();
                    uiEl.style.left = r.left + "px";
                    uiEl.style.top = r.top + "px";
                    uiEl.style.width = r.width + "px";
                    uiEl.style.height = r.height + "px";
                    uiEl.style.setProperty("--s", (r.width / VW).toFixed(4));
                }
                window.addEventListener("resize", resize);
                window.addEventListener("orientationchange", resize);

                /* ---------------- 世界内浮动名牌 ---------------- */
                const tags = [];
                function buildTags() {
                    npcs.forEach((n) => {
                        const el = document.createElement("div");
                        el.className = "wtag";
                        el.style.setProperty("--c", n.shirt);
                        el.innerHTML = '<span class="dot"></span>' + n.name;
                        tagsEl.appendChild(el);
                        tags.push({ el, x: n.x, y: GROUND_Y - 96, npc: n }); // 名牌悬在头顶上方，避开“!”气泡
                    });
                    // 终点提示牌
                    const goal = document.createElement("div");
                    goal.className = "wtag";
                    goal.classList.add("goal");
                    goal.textContent = "终点 · 欢迎你";
                    tagsEl.appendChild(goal);
                    tags.push({ el: goal, x: 4420, y: 112, npc: null });

                    // 起点告示牌牌面文字：贴在木牌上，随镜头一起移动
                    const sign = document.createElement("div");
                    sign.className = "wtag";
                    sign.classList.add("sign");
                    sign.textContent = "理学院";
                    tagsEl.appendChild(sign);
                    tags.push({ el: sign, x: 96, y: 236, npc: null });

                    // 终点拱门横幅上的「组 织 部」（原先是三颗像素爱心）
                    const archText = document.createElement("div");
                    archText.className = "wtag";
                    archText.classList.add("archtext");
                    ["组", "织", "部"].forEach((ch) => {
                        const sp = document.createElement("span");
                        sp.textContent = ch;
                        archText.appendChild(sp);
                    });
                    tagsEl.appendChild(archText);
                    tags.push({ el: archText, x: 4420, y: 168, npc: null });
                }
                function updateTags() {
                    const visible = state !== "ending"; // 结局画面不显示世界内的名牌
                    for (const t of tags) {
                        const sx = ((t.x - camera.x) / VW) * 100;
                        const sy = (t.y / VH) * 100;
                        if (!visible || sx < -14 || sx > 114) {
                            t.el.classList.remove("on");
                            continue;
                        }
                        // NPC 名牌：探索过的隐藏，避免与对话框重复
                        const hide = t.npc && t.npc.seen && state !== "title";
                        t.el.style.left = sx + "%";
                        t.el.style.top = sy + "%";
                        t.el.classList.toggle("on", !hide);
                    }
                }

                /* ---------------- HUD ---------------- */
                function buildHud() {
                    for (let i = 0; i < npcs.length; i++)
                        hudPipsEl.appendChild(document.createElement("i"));
                    refreshHud();
                }
                function refreshHud() {
                    hudNumEl.textContent = seenCount + " / " + npcs.length;
                    const pips = hudPipsEl.children;
                    for (let i = 0; i < pips.length; i++)
                        pips[i].classList.toggle("on", i < seenCount);
                }

                /* ---------------- 对话 ---------------- */
                let currentNpc = null;
                function openDialog(npc) {
                    currentNpc = npc;
                    npc.locked = true;
                    if (!npc.seen) {
                        npc.seen = true;
                        seenCount++;
                        refreshHud();
                    }
                    state = "dialog";

                    dlgNameEl.textContent = npc.name;
                    dlgNameEl.style.setProperty("--c", npc.shirt);
                    dlgTextEl.textContent = STORIES[npc.index] || "";
                    dialogEl.classList.add("show");

                    Sound.talk();
                    Sound.bgmDuck(true);
                }
                function closeDialog() {
                    if (state !== "dialog") return;
                    if (currentNpc) currentNpc.talked = true; // 聊完才揭示这块活动展板
                    dialogEl.classList.remove("show");
                    currentNpc = null;
                    state = "play";
                    Sound.close();
                    Sound.bgmDuck(false);
                    if (seenCount >= npcs.length) showToast();
                }

                /** 五段剧情全部看完时的轻提示（复用对话框位置，不打断节奏） */
                function showToast() {
                    dlgNameEl.textContent = "组织部";
                    dlgNameEl.style.setProperty("--c", "#ffd98a");
                    dlgTextEl.textContent =
                        "所有介绍都看完啦！继续向右走，去终点看看我们的彩蛋吧 →";
                    dialogEl.classList.add("show");
                    state = "toast";
                    setTimeout(() => {
                        if (state === "toast") {
                            dialogEl.classList.remove("show");
                            state = "play";
                        }
                    }, 2600);
                }

                /* ---------------- 结局彩蛋 ---------------- */
                function triggerEnding() {
                    if (state === "ending") return;
                    state = "ending";
                    endingT = 0;
                    player.vx = 0;
                    player.moving = false;
                    dialogEl.classList.remove("show");
                    hudEl.style.opacity = "0";
                    tags.forEach((t) => t.el.classList.remove("on"));
                    Sound.ending();
                    Sound.bgmDuck(true);
                    setTimeout(() => {
                        if (state === "ending") endingEl.classList.add("show");
                    }, 430);
                }

                function resetGame() {
                    state = "play";
                    endingT = 0;
                    player.x = 140;
                    player.vx = 0;
                    player.facing = 1;
                    player.animT = 0;
                    player.stepT = STEP_INTERVAL;
                    camera.x = 0;
                    seenCount = 0;
                    npcs.forEach((n) => {
                        n.seen = false;
                        n.locked = false;
                        n.talked = false;
                    });
                    refreshHud();
                    endingEl.classList.remove("show");
                    hudEl.style.opacity = "";
                    Sound.bgmDuck(false);
                }

                /* ---------------- 开始游戏 ---------------- */
                function startGame() {
                    Sound.init();
                    Sound.ready();
                    Sound.start();
                    titleEl.classList.add("hide");
                    setTimeout(() => {
                        titleEl.style.display = "none";
                    }, 600);
                    hudEl.style.opacity = "";
                    state = "play";
                }

                /* ---------------- 键盘输入 ---------------- */
                window.addEventListener("keydown", (e) => {
                    const k = e.code;
                    if (
                        [
                            "ArrowLeft",
                            "ArrowRight",
                            "ArrowUp",
                            "ArrowDown",
                            "Space",
                        ].includes(k)
                    )
                        e.preventDefault();
                    keys[k] = true;
                    if (e.repeat) return;
                    Sound.resume(); // 顺手唤醒可能被挂起的音频上下文

                    /* 标题页：任意启动键开始 */
                    if (state === "title") {
                        if (
                            k === "Space" ||
                            k === "Enter" ||
                            k === "NumpadEnter"
                        )
                            startGame();
                        return;
                    }
                    /* 结局页：R 键重来 */
                    if (state === "ending") {
                        if (k === "KeyR") resetGame();
                        return;
                    }
                    /* Galgame 问答：方向键选择、回车确认、空格跳过打字、Esc 结束提问 */
                    if (state === "galgame") {
                        if (k === "ArrowUp" || k === "ArrowLeft") {
                            galNav(-1);
                            return;
                        }
                        if (k === "ArrowDown" || k === "ArrowRight") {
                            galNav(1);
                            return;
                        }
                        if (k === "Enter" || k === "NumpadEnter") {
                            galConfirm();
                            return;
                        }
                        if (k === "Space") {
                            galSkip();
                            return;
                        }
                        if (k === "Escape") {
                            closeGal();
                            return;
                        }
                        if (/^(Digit|Numpad)[1-8]$/.test(k)) {
                            galPick(parseInt(k.slice(-1), 10) - 1);
                            return;
                        }
                        return;
                    }
                    /* 照片画框：空格 / 回车 / Esc 关闭 */
                    if (state === "photo") {
                        if (k === "Space" || k === "Enter" || k === "Escape")
                            closePhoto();
                        return;
                    }
                    /* 对话 / 提示：空格关闭 */
                    if (k === "Space" || k === "Enter") {
                        if (state === "dialog") closeDialog();
                        else if (state === "toast") {
                            dialogEl.classList.remove("show");
                            state = "play";
                        }
                    }
                    /* 背景音乐开关 */
                    if (k === "KeyM") Sound.bgmToggle();
                    /* 随时重来 */
                    if (k === "KeyR" && state === "play") resetGame();
                });
                window.addEventListener("keyup", (e) => {
                    keys[e.code] = false;
                });
                // 失焦时清空按键，避免切窗口后人物一直走
                window.addEventListener("blur", () => {
                    for (const k in keys) keys[k] = false;
                });

                /* ---------------- 移动端触控按钮 ---------------- */
                const tcMovePad = document.querySelector(".tc-move");
                const tcActPad = document.querySelector(".tc-act");
                const tcAgainPad = document.querySelector(".tc-again");
                const tcAction = document.getElementById("tc-action");

                const fireKey = (type, code) =>
                    window.dispatchEvent(new KeyboardEvent(type, { code }));

                // 按住方向键持续行走，松开即停；其余按钮点一下触发一次
                document.querySelectorAll("#touch .tc-btn").forEach((btn) => {
                    const code = btn.dataset.key;
                    btn.addEventListener("pointerdown", (e) => {
                        e.preventDefault();
                        fireKey("keydown", code);
                    });
                    ["pointerup", "pointercancel", "pointerleave"].forEach((t) =>
                        btn.addEventListener(t, () => fireKey("keyup", code)),
                    );
                    btn.addEventListener("contextmenu", (e) => e.preventDefault());
                });
                // 兜底：手指在任何地方抬起都清掉方向键，避免人物一直走
                ["pointerup", "pointercancel"].forEach((t) =>
                    window.addEventListener(t, () => {
                        fireKey("keyup", "ArrowLeft");
                        fireKey("keyup", "ArrowRight");
                    }),
                );

                /* 左上角开关：null=跟随设备，true=强制显示，false=强制隐藏 */
                const touchEl = document.getElementById("touch");
                const touchToggleEl = document.getElementById("touch-toggle");
                const touchStateEl = document.getElementById("touch-state");
                let touchMode = null;
                try {
                    const saved = window.localStorage && window.localStorage.getItem("szb-touch");
                    if (saved === "on") touchMode = true;
                    else if (saved === "off") touchMode = false;
                } catch (e) {
                    /* 隐私模式等场景下 localStorage 不可用，忽略即可 */
                }

                /** 触控层当前是否可见（不依赖 getComputedStyle，测试环境也能跑） */
                function touchLayerVisible() {
                    if (touchMode === true) return true;
                    if (touchMode === false) return false;
                    if (typeof window.getComputedStyle !== "function") return false;
                    return window.getComputedStyle(touchEl).display !== "none";
                }

                /** 应用开关状态：更新强制类、开关外观与按钮显隐 */
                function applyTouchMode() {
                    touchEl.classList.toggle("force-on", touchMode === true);
                    touchEl.classList.toggle("force-off", touchMode === false);
                    const on = touchLayerVisible();
                    touchToggleEl.classList.toggle("on", on);
                    touchToggleEl.setAttribute("aria-pressed", on ? "true" : "false");
                    touchStateEl.textContent = on ? "开" : "关";
                    lastTouchState = null; // 让状态刷新重算一次
                    updateTouchUI();
                    try {
                        if (window.localStorage)
                            window.localStorage.setItem("szb-touch", on ? "on" : "off");
                    } catch (e) {
                        /* 存不了就算了，不影响使用 */
                    }
                }

                touchToggleEl.addEventListener("click", (e) => {
                    e.stopPropagation();
                    touchMode = !touchLayerVisible();
                    applyTouchMode();
                });

                /** 触控按钮随状态显隐：探索时走路、对话时继续、结局时重来 */
                let lastTouchState = null;
                function updateTouchUI() {
                    if (state === lastTouchState) return;
                    lastTouchState = state;
                    const walking = state === "play" || state === "toast";
                    const acting =
                        state === "title" || state === "dialog" || state === "toast";
                    tcMovePad.classList.toggle("on", walking);
                    tcActPad.classList.toggle("on", acting);
                    tcAgainPad.classList.toggle("on", state === "ending");
                    tcAction.textContent =
                        state === "title" ? "开 始" : state === "dialog" ? "继 续" : "关 闭";
                }

                /* ---------------- 主循环 ---------------- */
                let lastTime = performance.now();
                function loop(now) {
                    let dt = (now - lastTime) / 1000;
                    lastTime = now;
                    if (dt > 0.05) dt = 0.05; // 切标签页回来时避免跳帧
                    if (dt < 0) dt = 0;

                    update(dt);
                    render();
                    updateTags();
                    updateBooths();
                    updateTouchUI();

                    requestAnimationFrame(loop);
                }

                /* ---------------- 启动 ---------------- */
                buildGround();
                buildScenery();
                buildFarStrip();
                buildMidStrip();
                buildArchBuilding();
                buildLibrary();
                buildDuskScene();
                buildPortrait();
                buildTags();
                buildBooths();
                buildHud();
                resize();
                applyTouchMode();
                requestAnimationFrame(loop);
            })();
        </script>
    </body>
</html>
