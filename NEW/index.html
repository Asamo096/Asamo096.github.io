                    rect(g, 2 + L, 6, 2, 4, hair); // 脑后发束
                    rect(g, 11 + L, 3, 2, 1, hair); // 前额发梢
                    if (c.hair === "long")
                        rect(g, 2 + L, 3, 2, 11, shade(hair, -0.08)); // 长发顺在身后

                    /* ---- 配饰（全部朝前） ---- */
                    if (c.acc === "cap") {
                        rect(g, 3 + L, -1, 10, 2, "#6fa8dc");
                        rect(g, 3 + L, 1, 10, 1, "#4d84b8");
                        rect(g, 12 + L, 1, 3, 1, "#4d84b8"); // 帽檐
                    }
                    if (c.acc === "glasses") {
                        rect(g, 6 + L, 4, 6, 1, "#5b6b7d");
                        rect(g, 6 + L, 6, 6, 1, "#5b6b7d");
                        rect(g, 6 + L, 5, 1, 1, "#5b6b7d");
                        rect(g, 8 + L, 5, 1, 1, "#5b6b7d");
                        rect(g, 9 + L, 5, 1, 1, "#5b6b7d");
                        rect(g, 11 + L, 5, 1, 1, "#5b6b7d");
                        rect(g, 7 + L, 5, 1, 1, "#dff0ff");
                        rect(g, 10 + L, 5, 1, 1, "#dff0ff");
                    }
                    if (c.acc === "bow") {
                        rect(g, 11 + L, -1, 3, 2, "#ff9db3");
                        rect(g, 12 + L, -1, 1, 2, "#e8788f");
                    }

                    g.restore();
                }

                /** 未触达的 NPC 头顶的“!”气泡 */
                function drawExclaim(g, cx, topY, t) {
                    const S = 1.7;
                    const bob = Math.round(Math.sin(t * 3.4) * 2);
                    const w = 9,
                        h = 12;
                    g.save();
                    g.translate(
                        Math.round(cx - (w * S) / 2),
                        Math.round(topY - (h + 4) * S) + bob,
                    );
                    g.scale(S, S);
                    pxPanel(g, 0, 0, w, h, "#ffffff", "#4b4034");
                    rect(g, 3, h, 1, 2, "#4b4034"); // 气泡小尾巴
                    rect(g, 4, h, 2, 1, "#4b4034");
                    rect(g, 4, 3, 2, 5, "#d4718c"); // “!”
                    rect(g, 4, 9, 2, 2, "#d4718c");
                    g.restore();
                }

                /* ---------------- 景物绘制（全部绘制到预渲染层上） ---------------- */

                /** 杨树：细长的竖向树冠 + 笔直树干（校园行道树的标志性轮廓） */
                function drawPoplar(g, x, baseY, s, rr) {
                    const h = Math.round(74 * s); // 总高
                    const trunkW = Math.max(2, Math.round(3 * s));
                    const trunkH = Math.round(18 * s);
                    const rx = Math.max(3, Math.round(7.5 * s)); // 树冠半宽
                    const ry = Math.round((h - trunkH) / 2);

                    // 树干
                    rect(
                        g,
                        x - trunkW / 2,
                        baseY - trunkH,
                        trunkW,
                        trunkH,
                        "#b9a98d",
                    );
                    rect(
                        g,
                        x - trunkW / 2,
                        baseY - trunkH,
                        1,
                        trunkH,
                        "#9c8c70",
                    );

                    // 树冠：细长竖向椭圆（逐行扫描，天然像素阶梯）
                    const cy = baseY - trunkH - ry;
                    const rows = [];
                    for (let dy = -ry; dy <= ry; dy++) {
                        const w = Math.round(
                            rx *
                                Math.sqrt(
                                    Math.max(0, 1 - (dy * dy) / (ry * ry + 1)),
                                ),
                        );
                        rows.push([dy, w]);
                    }
                    g.fillStyle = "#6fae56";
                    for (const [dy, w] of rows)
                        g.fillRect(
                            Math.round(x - w),
                            Math.round(cy + dy),
                            w * 2 + 1,
                            1,
                        );
                    g.fillStyle = "#8ec973";
                    for (const [dy, w] of rows)
                        g.fillRect(
                            Math.round(x - w),
                            Math.round(cy + dy),
                            Math.max(1, Math.round(w * 1.05)),
                            1,
                        );
                    g.fillStyle = "#a8dc8d";
                    for (const [dy, w] of rows) {
                        if (dy < -ry * 0.15)
                            g.fillRect(
                                Math.round(x - w),
                                Math.round(cy + dy),
                                Math.max(1, Math.round(w * 0.55)),
                                1,
                            );
                    }
                    // 叶簇碎点
                    for (let i = 0; i < 22 * s; i++) {
                        const a = rr() * Math.PI * 2,
                            r = Math.sqrt(rr());
                        rect(
                            g,
                            x + Math.cos(a) * r * rx,
                            cy + Math.sin(a) * r * ry,
                            2,
                            2,
                            rr() > 0.5 ? "#b6e59c" : "#609b49",
                        );
                    }
                    // 树影
                    g.fillStyle = "rgba(70, 105, 58, .15)";
                    g.fillRect(x - rx - 2, baseY - 1, rx * 2 + 4, 2);
                }

                /** 灌木丛 */
                function drawBush(g, x, baseY, s, rr) {
                    const w = Math.round(22 * s),
                        h = Math.round(13 * s);
                    pixelCircle(g, x, baseY - h * 0.5, h * 0.52, "#79c268");
                    pixelCircle(
                        g,
                        x - w * 0.3,
                        baseY - h * 0.42,
                        h * 0.42,
                        "#8ed177",
                    );
                    pixelCircle(
                        g,
                        x + w * 0.3,
                        baseY - h * 0.42,
                        h * 0.42,
                        "#8ed177",
                    );
                    for (let i = 0; i < 6 * s; i++) {
                        rect(
                            g,
                            x - w / 2 + rr() * w,
                            baseY - h + rr() * h * 0.7,
                            2,
                            2,
                            "#b6e59c",
                        );
                    }
                    g.fillStyle = "rgba(70, 105, 58, .14)";
                    g.fillRect(x - w / 2, baseY - 1, w, 2);
                }

                /** 小花（颜色随机取一种柔和色） */
                const FLOWER_COLORS = [
                    "#ffb3c6",
                    "#ffe08a",
                    "#ffffff",
                    "#cbb2f0",
                    "#ffcfa0",
                ];
                function drawFlower(g, x, y, s, rr) {
                    const col =
                        FLOWER_COLORS[Math.floor(rr() * FLOWER_COLORS.length)];
                    const stem = Math.max(1, Math.round(s * 0.6));
                    rect(g, x, y + 3 * s, stem, 4 * s, "#6cb95a"); // 花茎
                    rect(g, x - 2 * s, y, 3 * s, 3 * s, col); // 花瓣
                    rect(g, x + 1 * s, y + 1 * s, 2 * s, 2 * s, col);
                    rect(g, x, y + 1 * s, 1, 1, "#fff6c9"); // 花心
                }
                /** 草丛 */
                function drawGrassTuft(g, x, y, s) {
                    const w = Math.max(1, Math.round(s));
                    rect(g, x, y, w, 3 * s, "#7cc464");
                    rect(g, x + 2 * s, y - 1, w, 3 * s + 1, "#8ed177");
                    rect(g, x + 4 * s, y, w, 3 * s, "#7cc464");
                }

                /** 路灯 */
                function drawLamp(g, x, baseY) {
                    rect(g, x - 1, baseY - 42, 3, 42, "#8b93a0");
                    rect(g, x - 1, baseY - 42, 1, 42, "#6f7885");
                    rect(g, x - 4, baseY - 48, 9, 7, "#ffd98a");
                    rect(g, x - 4, baseY - 48, 9, 2, "#fff0bd");
                    rect(g, x - 5, baseY - 50, 11, 2, "#6f7885");
                    rect(g, x - 3, baseY - 41, 7, 1, "#6f7885");
                    g.fillStyle = "rgba(255, 226, 150, .16)";
                    g.fillRect(x - 10, baseY - 44, 21, 44);
                }

                /** 长椅 */
                function drawBench(g, x, baseY) {
                    const w = 30,
                        left = x - w / 2;
                    // 靠背
                    rect(g, left, baseY - 17, w, 3, "#d3a878");
                    rect(g, left, baseY - 17, w, 1, "#e3bd90");
                    rect(g, left + 2, baseY - 13, 2, 3, "#b98d61");
                    rect(g, left + w - 4, baseY - 13, 2, 3, "#b98d61");
                    // 坐板
                    rect(g, left, baseY - 9, w, 3, "#e3bd90");
                    rect(g, left, baseY - 6, w, 1, "#b98d61");
                    // 椅腿
                    rect(g, left + 2, baseY - 5, 3, 5, "#8a6b4a");
                    rect(g, left + w - 5, baseY - 5, 3, 5, "#8a6b4a");
                    // 投影
                    g.fillStyle = "rgba(70, 105, 58, .15)";
                    g.fillRect(left, baseY - 1, w, 2);
                }

                /** 木质指示牌（起点用） */
                /** 木质指示牌（起点用）——牌面留白，文字由 DOM 标签呈现（见 buildTags） */
                function drawSign(g, x, baseY) {
                    rect(g, x - 2, baseY - 34, 4, 34, "#a9784f");
                    rect(g, x - 2, baseY - 34, 1, 34, "#8d6141");
                    pxPanel(
                        g,
                        x - 16,
                        baseY - 52,
                        32,
                        20,
                        "#fff3d0",
                        "#a9784f",
                    );
                    // 牌面内框，给文字留出位置
                    rect(g, x - 13, baseY - 49, 26, 14, "#fdf7e4");
                    g.fillStyle = "rgba(70, 105, 58, .16)";
                    g.fillRect(x - 8, baseY - 2, 16, 2);
                }

                /** 终点拱门（欢迎小站） */
                function drawArch(g, x, baseY) {
                    const half = 74;
                    // 立柱
                    [-half, half].forEach((dx) => {
                        rect(g, x + dx - 5, baseY - 128, 10, 128, "#d3a878");
                        rect(g, x + dx - 5, baseY - 128, 3, 128, "#b98d61");
                        rect(g, x + dx - 7, baseY - 5, 14, 5, "#b98d61");
                        rect(g, x + dx - 7, baseY - 132, 14, 5, "#e3bd90");
                    });
                    // 横幅
                    pxPanel(
                        g,
                        x - half - 12,
                        baseY - 160,
                        (half + 12) * 2,
                        30,
                        "#fff3d0",
                        "#d3a878",
                    );
                    rect(
                        g,
                        x - half - 12,
                        baseY - 160,
                        (half + 12) * 2,
                        4,
                        "#ffe6b8",
                    );
                    // 横幅正中留出浅色底，供「组 织 部」三个字使用（文字由 DOM 标签呈现，见 buildTags）
                    rect(g, x - 68, baseY - 155, 136, 21, "#fffaea");
                    // 小彩旗
                    for (let i = 0; i < 8; i++) {
                        const fx = x - half + 6 + i * 18;
                        const col = [
                            "#8fd3f4",
                            "#ffd98a",
                            "#c9e88f",
                            "#ffb3c6",
                        ][i % 4];
                        rect(g, fx, baseY - 130, 2, 8, "#c9a86a");
                        rect(g, fx + 2, baseY - 130, 8, 5, col);
                    }
                    // 地面投影
                    g.fillStyle = "rgba(70, 105, 58, .16)";
                    g.fillRect(x - half - 8, baseY - 2, half * 2 + 16, 2);
                }

                /* =====================================================================
   6. 场景预渲染
   把「草地」和「装饰物」一次性画进离屏画布，运行时只做一次贴图，保证流畅
   ===================================================================== */

                /** 生成柔软的云朵精灵（像素方块拼成） */
                const CLOUD_ROWS = [
                    ".....111.....",
                    "...1111111...",
                    "..111111111..",
                    ".11111111111.",
                    "1111111111111",
                    "2222222222222",
                ];
                function makeCloudSprite(s) {
                    const cvs = document.createElement("canvas");
                    cvs.width = Math.round(13 * s);
                    cvs.height = Math.round(6 * s);
                    const g = cvs.getContext("2d");
                    for (let ry = 0; ry < CLOUD_ROWS.length; ry++) {
                        const row = CLOUD_ROWS[ry];
                        for (let rx = 0; rx < row.length; rx++) {
                            const ch = row[rx];
                            if (ch === ".") continue;
                            g.fillStyle = ch === "1" ? "#ffffff" : "#e2f0fc";
                            g.fillRect(
                                Math.round(rx * s),
                                Math.round(ry * s),
                                Math.ceil(s),
                                Math.ceil(s),
                            );
                        }
                    }
                    return cvs;
                }

                const GROUND_TOP = HORIZON; // 草地层在屏幕上的起始 y
                const SCENERY_TOP = 110; // 装饰物层在屏幕上的起始 y（需容纳终点拱门与高树）
                const SCENE_SCALE = 2; // 景物放大倍数（必须取整数倍，否则像素边缘会被抗锯齿糊掉）

                let groundCanvas = null; // 草地 + 路面 + 花草纹理
                let sceneryCanvas = null; // 树、灌木、路灯、长椅、指示牌、终点拱门

                /** 以 (x, baseY) 为基点、按 s 倍缩放绘制景物（景物函数一律按基点相对坐标作画） */
                function atBase(g, x, baseY, s, drawFn) {
                    g.save();
                    g.translate(x, baseY);
                    g.scale(s, s);
                    drawFn(g, 0, 0);
                    g.restore();
                }

                /** 预渲染草地层 */
                function buildGround() {
                    const cvs = document.createElement("canvas");
                    cvs.width = WORLD_W;
                    cvs.height = VH - GROUND_TOP; // 132 像素高
                    const g = cvs.getContext("2d");
                    const H = cvs.height;
                    const rr = mulberry32(20240501);
                    const yl = (screenY) => screenY - GROUND_TOP; // 屏幕 y → 本层局部 y

                    // 远→近 草地分层（营造纵深）
                    rect(
                        g,
                        0,
                        yl(HORIZON),
                        WORLD_W,
                        yl(252) - yl(HORIZON),
                        "#bce698",
                    );
                    rect(g, 0, yl(252), WORLD_W, yl(298) - yl(252), "#a7dc8d");
                    // 灰色人行道
                    rect(g, 0, yl(298), WORLD_W, yl(342) - yl(298), "#d2d2cc");
                    rect(g, 0, yl(298), WORLD_W, 2, "#bcbcb6"); // 道牙
                    rect(g, 0, yl(340), WORLD_W, 2, "#c4c4be");
                    // 人行道砖缝
                    for (let x = 0; x < WORLD_W; x += 26)
                        rect(g, x, yl(300), 1, yl(340) - yl(300), "#c6c6c0");
                    rect(g, 0, yl(319), WORLD_W, 1, "#c6c6c0");
                    // 近景草地
                    rect(g, 0, yl(342), WORLD_W, H - yl(342), "#93cf7d");

                    // 草地细腻纹理（小横点，营造像素草皮质感）
                    for (let i = 0; i < 4200; i++) {
                        const x = rr() * WORLD_W;
                        const sy = HORIZON + rr() * (VH - HORIZON); // 屏幕 y，用于判断所在层次
                        let col;
                        if (sy < 252) col = rr() > 0.5 ? "#c9eca6" : "#b0e093";
                        else if (sy < 298)
                            col = rr() > 0.5 ? "#b4e59c" : "#98d17f";
                        else if (sy < 342)
                            col = rr() > 0.5 ? "#e2e2dc" : "#c2c2bc";
                        else col = rr() > 0.5 ? "#9ed987" : "#85c46f";
                        rect(
                            g,
                            x,
                            yl(sy),
                            2 + Math.round(rr() * 2),
                            1 + Math.round(rr()),
                            col,
                        );
                    }
                    // 草叶簇与小花（用整数倍放大，和放大的角色保持同样的像素颗粒感）
                    const FLORA = 2;
                    for (let x = 0; x < WORLD_W; x += 20 + rr() * 32) {
                        drawGrassTuft(g, x, yl(250 + rr() * 40), FLORA);
                        drawGrassTuft(g, x + 8, yl(346 + rr() * 8), FLORA);
                    }
                    for (let x = 40; x < WORLD_W; x += 60 + rr() * 110) {
                        drawFlower(g, x, yl(286 + rr() * 6), FLORA, rr);
                        drawFlower(g, x + 26, yl(346 + rr() * 8), FLORA, rr);
                        if (rr() > 0.55)
                            drawFlower(
                                g,
                                x + 76,
                                yl(262 + rr() * 24),
                                FLORA,
                                rr,
                            );
                        if (rr() > 0.6)
                            drawFlower(
                                g,
                                x + 130,
                                yl(288 + rr() * 8),
                                FLORA,
                                rr,
                            );
                    }
                    // 人行道上的细碎颗粒
                    for (let i = 0; i < 760; i++) {
                        const x = rr() * WORLD_W,
                            sy = 304 + rr() * 32;
                        rect(
                            g,
                            x,
                            yl(sy),
                            3,
                            1 + Math.round(rr()),
                            rr() > 0.5 ? "#c8c8c2" : "#e6e6e0",
                        );
                    }

                    groundCanvas = cvs;
                }

                /** 预渲染装饰物层 */
                function buildScenery() {
                    const cvs = document.createElement("canvas");
                    cvs.width = WORLD_W;
                    cvs.height = VH - SCENERY_TOP;
                    const g = cvs.getContext("2d");
                    g.translate(0, -SCENERY_TOP); // 之后按屏幕坐标作画即可
                    const rr = mulberry32(778899);

                    // NPC 附近留白，避免装饰物遮挡人物
                    const nearNpc = (x, pad) =>
                        NPC_DATA.some((n) => Math.abs(n.x - x) < pad);

                    // ---- 成排杨树（统一 2 倍整数缩放，保持像素硬边） ----
                    for (
                        let x = 150;
                        x < WORLD_W - 260;
                        x += 230 + rr() * 140
                    ) {
                        if (nearNpc(x, 110)) continue;
                        atBase(g, x, 292, SCENE_SCALE, (gg, ox, oy) =>
                            drawPoplar(gg, ox, oy, 1, rr),
                        );
                    }
                    // ---- 灌木 ----
                    for (
                        let x = 220;
                        x < WORLD_W - 200;
                        x += 160 + rr() * 110
                    ) {
                        if (nearNpc(x, 92)) continue;
                        atBase(g, x, 296, SCENE_SCALE, (gg, ox, oy) =>
                            drawBush(gg, ox, oy, 1, rr),
                        );
                    }
                    // ---- 路灯 ----
                    for (
                        let x = 520;
                        x < WORLD_W - 220;
                        x += 520 + rr() * 160
                    ) {
                        if (nearNpc(x, 120)) continue;
                        atBase(g, x, 300, SCENE_SCALE, drawLamp);
                    }
                    // ---- 长椅 ----
                    for (
                        let x = 980;
                        x < WORLD_W - 300;
                        x += 880 + rr() * 260
                    ) {
                        if (nearNpc(x, 130)) continue;
                        atBase(g, x, 300, SCENE_SCALE, drawBench);
                    }
                    // ---- 起点指示牌 ----
                    atBase(g, 96, 300, SCENE_SCALE, drawSign);
                    // ---- 终点拱门（本身已足够高，保持原尺寸） ----
                    atBase(g, 4420, 302, 1, drawArch);

                    sceneryCanvas = cvs;
                }

                /* =====================================================================
   6.5 三层视差背景（复刻黑龙江八一农垦大学）
   —— 远景层：松嫩平原上的校园航拍全景（可无缝横向平铺，视差最慢）
   —— 中景层：中距离林带与低矮建筑（可平铺，视差居中）
   —— 地标：前段「拱门主教学楼」、后段「环湖图书馆」（随推进依次切换）
   ===================================================================== */
                const PAR_FAR = 0.22; // 远景视差系数（越小越慢）
                const PAR_MID = 0.62; // 中景视差系数
                const FAR_W = 1600,
                    FAR_H = 120,
                    FAR_TOP = HORIZON - FAR_H;
                const MID_W = 1400,
                    MID_H = 130,
                    MID_TOP = HORIZON - MID_H;

                let farCanvas = null,
                    midCanvas = null;
                let archCanvas = null,
                    libraryCanvas = null,
                    duskCanvas = null;

                /** 带子顶部做一段「抖色」过渡，让远景层上沿自然化进天空 */
                function ditherTop(g, W, rows, color) {
                    for (let y = 0; y < rows; y++) {
                        const density = (y + 1) / rows;
                        for (let x = 0; x < W; x += 2) {
                            if (((x >> 1) + y) % 2 !== 0 && density < 0.72)
                                continue;
                            g.globalAlpha = Math.min(1, density * 1.35);
                            g.fillStyle = color;
                            g.fillRect(x, y, 2, 1);
                        }
                    }
                    g.globalAlpha = 1;
                }

                /** 在平铺带里画一个元素：靠近两端时补画一份，保证横向无缝 */
                function wrapped(x, W, fn) {
                    fn(x);
                    if (x < 140) fn(x + W);
                    if (x > W - 140) fn(x - W);
                }

                /** 远景层：辽阔平原 + 薄雾 + 成片浅绿树林 + 低矮建筑群轮廓（无人物） */
                function buildFarStrip() {
                    const cvs = document.createElement("canvas");
                    cvs.width = FAR_W;
                    cvs.height = FAR_H;
                    const g = cvs.getContext("2d");
                    const rr = mulberry32(90210);

                    // 平原：越接近地平线越沉一点，形成辽阔感
                    rect(g, 0, 20, FAR_W, FAR_H - 20, "#dcecc9");
                    rect(g, 0, 38, FAR_W, 14, "#d3e6bd");
                    rect(g, 0, 56, FAR_W, FAR_H - 56, "#c9dfb1");
                    ditherTop(g, FAR_W, 20, "#e6f2e6");

                    // 远处成片浅绿树林
                    for (let i = 0; i < 30; i++) {
                        const cx = rr() * FAR_W,
                            cy = 42 + rr() * 18,
                            w = 50 + rr() * 110;
                        const tone = rr() > 0.5 ? "#bad9a1" : "#b0d299";
                        wrapped(cx, FAR_W, (x) => {
                            for (let dx = -w / 2; dx < w / 2; dx += 5) {
                                pixelCircle(
                                    g,
                                    x + dx,
                                    cy + Math.sin(dx * 0.22) * 2,
                                    4 + rr() * 2,
                                    tone,
                                );
                            }
                        });
                    }

                    // 低矮建筑群轮廓
                    for (let i = 0; i < 20; i++) {
                        const cx = rr() * FAR_W,

                /** 中景层：中距离杨树林带 + 低矮校舍 + 田垄（可平铺） */

                /* ---------------- 中景地标一：拱门主教学楼 ---------------- */
                const ARCH_X = 520; // 画布左边缘对应的世界坐标
                const ARCH_W = 900,
                    ARCH_H = 170;
                function buildArchBuilding() {
                    const cvs = document.createElement("canvas");
                    cvs.width = ARCH_W;
                    cvs.height = ARCH_H;
                    const g = cvs.getContext("2d");

                    rect(g, 26, H - 18, ARCH_W - 52, 18, "#d9d9d3");
                    rect(g, 26, H - 18, ARCH_W - 52, 2, "#c2c2bb");
                    for (let x = 56; x < ARCH_W - 40; x += 46)

                    // 广场两侧行道杨树（先画，让建筑压在上面形成前后层次）

                    rect(g, bx, 50, bw, 2, "#fffdf4");
                    rect(g, bx, H - 24, bw, 6, "#dbd4c0"); // 勒脚
                    // 屋顶
                    rect(g, bx - 14, 34, bw + 28, 18, "#8e939a");
                    rect(g, bx - 14, 34, bw + 28, 3, "#a9aeb4");
                    rect(g, bx - 14, 49, bw + 28, 3, "#767b83");
                    rect(g, 396, 16, 108, 20, "#8e939a"); // 中央塔楼
                    rect(g, 396, 16, 108, 3, "#a9aeb4");
                    rect(g, 396, 33, 108, 3, "#767b83");
                    // 窗户
                    for (let row = 0; row < 3; row++) {
                        const wy = 62 + row * 29;
                        for (let x = bx + 20; x < bx + bw - 34; x += 34) {

                            g,

                            aTop + dy,
                            half * 2,
                            1,
                            dy < 32 ? "#8d8478" : "#7b7368",
                        );

                    rect(g, ax - 32, 132, 64, 18, "#b7a686"); // 拱洞里的暖光

                    [220, 300, 600, 680].forEach((x) =>
                        atBase(g, x, H - 22, 1, (gg, ox, oy) =>

                /* ---------------- 中景地标二：环湖图书馆 ---------------- */
                const LIB_X = 2260; // 画布左边缘对应的世界坐标
                const LIB_W = 1900,
                    LIB_H = 190;
                function buildLibrary() {
                    const cvs = document.createElement("canvas");
                    cvs.width = LIB_W;
                    cvs.height = LIB_H;

                    // 水面高度：两端收窄成湖湾，避免画布左右边缘出现生硬的垂直切口
                    const waterTop = (x) => {
                        const t = x / LIB_W;

                        return WATER + Math.round((1 - k) * 48);

                    // 对岸草地
                    rect(g, 0, WATER - 6, LIB_W, 6, "#cfe0b6");

                    // 湖面（逐列绘制，两端自然收窄）
                    for (let x = 0; x < LIB_W; x += 2) {

                        rect(g, x, top, 2, 2, "#bcdcec");
                    }

                    // 建筑：弧形流线型屋顶 + 玻璃幕墙
                    const bx = 560,

                        x0 = bx,

                    for (let x = x0 - 26; x <= x1 + 26; x++) {

                        rect(g, x, top, 1, roofBottom - top + 2, "#e9eef2");
