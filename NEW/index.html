<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>像素校园 · 社联组织部招新探索</title>
        <style>
            /* =====================================================================
   基础重置与页面底色
   ===================================================================== */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                /* 演示场景：禁用长按选中与点按高亮 */
                -webkit-tap-highlight-color: transparent;
                -webkit-user-drag: none;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #3c4a3d; /* 投影留白区域：柔和的草绿深色，不刺眼 */
                -webkit-font-smoothing: antialiased;
                /* 禁止选中文字、禁止 iOS 长按弹出菜单 */
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                overscroll-behavior: none; /* 移动端禁用下拉刷新与滚动回弹 */
                -webkit-text-size-adjust: 100%;
            }

            /* 统一字体栈：优先像素中文字体，找不到则回落到系统黑体（无需任何外链） */
            :root {
                --font:
                    "Zpix", "Fusion Pixel 12px", "方正像素", "Microsoft YaHei",
                    "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC",
                    sans-serif;
            }

            /* =====================================================================
   画布（逻辑分辨率 640x360，通过 CSS 放大铺满屏幕，保持像素硬边）
   ===================================================================== */
            #game {
                display: block;
                image-rendering: pixelated;
                image-rendering: -moz-crisp-edges;
                image-rendering: crisp-edges;
                background: #cfe9fb;
                box-shadow:
                    0 0 0 4px rgba(0, 0, 0, 0.12),
                    0 14px 40px rgba(0, 0, 0, 0.28);
            }

            /* =====================================================================
   UI 覆盖层：尺寸与画布完全对齐，1 逻辑像素 = --s 个 CSS 像素
   ===================================================================== */
            #ui {
                position: fixed;
                left: 0;
                top: 0;
                width: 640px;
                height: 360px;
                pointer-events: none; /* 全部用键盘操作，不拦截鼠标 */
                font-family: var(--font);
                font-weight: 700;
                letter-spacing: 0.04em;
                color: #4b4034;
                --s: 3;
            }

            /* ---------- 通用像素面板（双层描边，模拟复古游戏边框） ---------- */
            .pxpanel {
                background: #fff9ec;
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow:
                    0 0 0 calc(var(--s) * 2px) #fffdf7,
                    0 0 0 calc(var(--s) * 3px) #4b4034,
                    0 0 0 calc(var(--s) * 6px) rgba(75, 64, 52, 0.1),
                    0 calc(var(--s) * 6px) calc(var(--s) * 14px)
                        rgba(52, 72, 44, 0.18);
            }

            /* =====================================================================
   世界内浮动名牌（NPC 头顶 / 终点牌）
   ===================================================================== */
            #tags {
                position: absolute;
                inset: 0;
            }

            .wtag {
                position: absolute;
                left: 0;
                top: 0;
                transform: translate(-50%, -100%);
                display: flex;
                align-items: center;
                gap: calc(var(--s) * 2px);
                padding: calc(var(--s) * 1.2px) calc(var(--s) * 4px);
                font-size: calc(var(--s) * 5px);
                line-height: 1.35;
                white-space: nowrap;
                color: #3a3229;
                background: #fffdf5;
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow:
                    0 0 0 calc(var(--s) * 1px) #fffdf5,
                    calc(var(--s) * 1px) calc(var(--s) * 2px) 0
                        rgba(75, 64, 52, 0.22);
                opacity: 0;
                transition: opacity 0.25s ease;
            }
            .wtag.on {
                opacity: 1;
            }
            .wtag .dot {
                width: calc(var(--s) * 3px);
                height: calc(var(--s) * 3px);
                background: var(--c, #8fd3f4);
                border: calc(var(--s) * 1px) solid #4b4034;
                flex: none;
            }
            .wtag.goal {
                background: #fff3d0;
                font-size: calc(var(--s) * 5.6px);
            }

            /* 起点告示牌牌面文字：贴在木牌上，不加底色和边框 */
            .wtag.sign {
                justify-content: center;
                width: calc(var(--s) * 62px);
                height: calc(var(--s) * 38px);
                padding: 0;
                font-size: calc(var(--s) * 9.5px);
                letter-spacing: 0.08em;
                color: #7a6440;
                background: transparent;
                border: none;
                box-shadow: none;
                text-shadow: calc(var(--s) * 0.6px) calc(var(--s) * 0.6px) 0
                    rgba(255, 255, 255, 0.7);
            }
            .wtag.sign::after {
                display: none;
            }

            /* 终点拱门横幅上的「组 织 部」：三字等距铺开，不加底色和边框 */
            .wtag.archtext {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: calc(var(--s) * 132px);
                height: calc(var(--s) * 22px);
                padding: 0;
                font-size: calc(var(--s) * 12px);
                color: #e0708c;
                background: transparent;
                border: none;
                box-shadow: none;
                text-shadow: calc(var(--s) * 0.6px) calc(var(--s) * 0.6px) 0
                    rgba(255, 255, 255, 0.8);
            }
            .wtag.archtext::after {
                display: none;
            }

            /* NPC 名牌下方的“三角指示” */
            .wtag::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: calc(var(--s) * -3px);
                width: 0;
                height: 0;
                margin-left: calc(var(--s) * -2px);
                border-left: calc(var(--s) * 2px) solid transparent;
                border-right: calc(var(--s) * 2px) solid transparent;
                border-top: calc(var(--s) * 3px) solid #4b4034;
            }

            /* =====================================================================
   顶部状态栏
   ===================================================================== */
            #hud {
                position: absolute;
                left: 0;
                top: 0;
                right: 0;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                padding: calc(var(--s) * 5px) calc(var(--s) * 6px);
                transition: opacity 0.3s ease;
            }
            /* 左上角一列：按钮开关 + 进度牌 */
            .hud-left {
                display: flex;
                align-items: flex-start;
                gap: calc(var(--s) * 4px);
            }
            /* 触控按钮开关：尺寸不随画布缩放，保证手机上也能点到 */
            #touch-toggle {
                flex: none;
                width: clamp(44px, 5vmin, 60px);
                height: clamp(44px, 5vmin, 60px);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1px;
                font-family: var(--font);
                font-weight: 700;
                font-size: clamp(11px, 1.45vmin, 15px);
                line-height: 1.05;
                color: #3a3229;
                background: #fff9ec;
                border: 2px solid #4b4034;
                border-radius: 5px;
                box-shadow:
                    0 0 0 2px #fffdf7,
                    0 3px 0 rgba(75, 64, 52, 0.28);
                cursor: pointer;
                pointer-events: auto; /* #ui 整体穿透，这里要单独打开 */
                touch-action: manipulation;
                user-select: none;
                -webkit-user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
            #touch-toggle b {
                font-size: clamp(12px, 1.6vmin, 17px);
            }
            #touch-toggle:active {
                transform: translateY(2px);
                box-shadow:
                    0 0 0 2px #fffdf7,
                    0 1px 0 rgba(75, 64, 52, 0.28);
            }
            /* 按钮开着时变绿，一眼可辨 */
            #touch-toggle.on {
                background: #d8f0d4;
            }

            /* 强制显示 / 隐藏触控层（覆盖设备判定） */
            #touch.force-on {
                display: block !important;
            }
            #touch.force-off {
                display: none !important;
            }
            .hud-chip {
                display: flex;
                align-items: center;
                gap: calc(var(--s) * 3px);
                padding: calc(var(--s) * 2px) calc(var(--s) * 5px);
                font-size: calc(var(--s) * 4.6px);
                background: rgba(255, 253, 247, 0.92);
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow: calc(var(--s) * 1px) calc(var(--s) * 2px) 0
                    rgba(75, 64, 52, 0.18);
                color: #3a3229;
            }
            .hud-chip .num {
                color: #2f7d4f;
                font-variant-numeric: tabular-nums;
            }
            .pips {
                display: flex;
                gap: calc(var(--s) * 1.5px);
                margin-left: calc(var(--s) * 1px);
            }
            .pips i {
                display: block;
                width: calc(var(--s) * 3px);
                height: calc(var(--s) * 3px);
                background: #e4dccc;
                border: calc(var(--s) * 1px) solid #8c8071;
            }
            .pips i.on {
                background: #ff9fb4;
                border-color: #c9647d;
            }
            .hud-chip.keys {
                opacity: 0.85;
                font-weight: 600;
            }

            /* =====================================================================
   对话框
   ===================================================================== */
            #dialog {
                position: absolute;
                left: 50%;
                top: calc(var(--s) * 34px);   /* 屏幕上方：投影时下沿常被前排观众挡住 */
                width: 92%;
                padding: calc(var(--s) * 32px) calc(var(--s) * 11px) calc(var(--s) * 9px);
                font-size: calc(var(--s) * 12px);
                line-height: 1.78;
                transform: translateX(-50%) translateY(calc(var(--s) * -10px))
                    scale(0.98);
                opacity: 0;
                transition:
                    opacity 0.18s ease-out,
                    transform 0.18s ease-out;
            }
            #dialog.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }

            #dlg-name {
                position: absolute;
                left: calc(var(--s) * 11px);
                top: calc(var(--s) * 8px);
                padding: calc(var(--s) * 1.6px) calc(var(--s) * 5px);
                font-size: calc(var(--s) * 8.2px);
                color: #2f2a23;
                background: var(--c, #8fd3f4);
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow: 0 0 0 calc(var(--s) * 1.5px) #fff9ec;
            }

            #dlg-text {
                color: #40382d;
                text-shadow: 0 calc(var(--s) * 0.5px) 0 rgba(255, 255, 255, 0.8);
                min-height: 1.85em;
            }

            #dlg-hint {
                margin-top: calc(var(--s) * 3px);
                text-align: right;
                font-size: calc(var(--s) * 5px);
                color: #9a8b76;
                font-weight: 600;
            }
            #dlg-hint .arrow {
                display: inline-block;
                animation: blink 1s steps(1, end) infinite;
            }
            @keyframes blink {
                0%,
                60% {
                    opacity: 1;
                }
                61%,
                100% {
                    opacity: 0.15;
                }
            }

            /* =====================================================================
   标题页
   ===================================================================== */
            #title {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(
                    120% 90% at 50% 10%,
                    rgba(255, 255, 255, 0.84) 0%,
                    rgba(255, 252, 240, 0.62) 48%,
                    rgba(206, 234, 246, 0.52) 100%
                );
                transition: opacity 0.55s ease;
            }
            #title.hide {
                opacity: 0;
            }
            .title-card {
                text-align: center;
                padding: calc(var(--s) * 24px) calc(var(--s) * 40px);
                background: rgba(255, 255, 255, 0.8);
                border: calc(var(--s) * 1px) solid rgba(75, 64, 52, 0.35);
                box-shadow:
                    0 0 0 calc(var(--s) * 2px) rgba(255, 255, 255, 0.7),
                    0 calc(var(--s) * 8px) calc(var(--s) * 20px)
                        rgba(52, 72, 44, 0.12);
            }
            .t-sub {
                font-size: calc(var(--s) * 7.5px);
                letter-spacing: 0.5em;
                color: #7d9a86;
                margin-bottom: calc(var(--s) * 8px);
            }
            .t-main {
                font-size: calc(var(--s) * 29px);
                line-height: 1.25;
                color: #35443a;
                letter-spacing: 0.06em;
                text-shadow:
                    calc(var(--s) * 1px) calc(var(--s) * 1px) 0 #fff,
                    calc(var(--s) * 2px) calc(var(--s) * 2px) 0 #cfe6d4;
            }
            .t-line {
                margin-top: calc(var(--s) * 11px);
                font-size: calc(var(--s) * 10.5px);
                color: #6b8a76;
                letter-spacing: 0.16em;
            }
            .t-keys {
                margin-top: calc(var(--s) * 18px);
                font-size: calc(var(--s) * 7.2px);
                color: #8a9a8f;
                font-weight: 600;
                letter-spacing: 0.1em;
            }
            .t-start {
                margin-top: calc(var(--s) * 15px);
                font-size: calc(var(--s) * 10.5px);
                color: #d4718c;
                animation: breathe 1.6s ease-in-out infinite;
            }
            @keyframes breathe {
                0%,
                100% {
                    opacity: 0.45;
                }
                50% {
                    opacity: 1;
                }
            }

            /* =====================================================================
   Galgame 问答界面（组织部部长）
   —— 上方：纯 CSS 绘制的角色立绘占位框
   —— 下方：底部对话框（左侧角色名） + 可点击的提问选项按钮
   ===================================================================== */
            #gal {
                position: absolute;
                inset: 0;
                display: none;
                background: linear-gradient(
                    180deg,
                    #e8f6ff 0%,
                    #eefaf0 42%,
                    #fffbf1 100%
                );
                opacity: 0;
                transition: opacity 0.3s ease;
                pointer-events: none; /* 只有对话框与选项按钮可点 */
            }
            #gal.on {
                display: block;
            }
            #gal.show {
                opacity: 1;
            }

            /* ---------- 立绘占位框 ---------- */
            .gal-figure {
                position: absolute;
                left: 50%;
                top: calc(var(--s) * 6px);
                transform: translateX(-50%);
                width: calc(var(--s) * 106px);
                height: calc(var(--s) * 88px);
                /* 基准点放在左上角：像素图的 box-shadow 从基准点向右下铺开 */
                display: block;
                padding: calc(var(--s) * 3px) 0 0 calc(var(--s) * 21px);
                background: linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #eef8ff 62%,
                    #e3f3e4 100%
                );
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow:
                    0 0 0 calc(var(--s) * 2px) #fffdf7,
                    0 0 0 calc(var(--s) * 3px) #4b4034,
                    0 calc(var(--s) * 6px) calc(var(--s) * 14px)
                        rgba(52, 72, 44, 0.14);
                overflow: hidden;
            }
            /* 像素点：1em 方块 + 大量 box-shadow 拼成立绘（纯 CSS，无图片） */
            .gal-px {
                display: block;
                width: 1em;
                height: 1em;
                font-size: calc(var(--s) * 2.7px);
                background: transparent;
            }
            .gal-figure-cap {
                position: absolute;
                left: 50%;
                top: calc(var(--s) * 96px);
                transform: translateX(-50%);
                font-size: calc(var(--s) * 4.6px);
                color: #9aa79b;
                letter-spacing: 0.12em;
                white-space: nowrap;
            }

            /* ---------- 对话框（固定在选项上方，高度按最长回复预留 4 行） ---------- */
            .gal-dialog {
                position: absolute;
                left: 5%;
                right: 5%;
                top: calc(var(--s) * 118px);
                height: calc(var(--s) * 118px);
                padding: calc(var(--s) * 12px) calc(var(--s) * 10px)
                    calc(var(--s) * 9px);
                pointer-events: auto;
                cursor: pointer;
            }
            .gal-nameplate {
                position: absolute;
                left: calc(var(--s) * 9px);
                top: calc(var(--s) * -8px);
                padding: calc(var(--s) * 1.8px) calc(var(--s) * 8px);
                font-size: calc(var(--s) * 9.6px);
                color: #2f2a23;
                background: var(--c, #8fd3f4);
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow: 0 0 0 calc(var(--s) * 2px) #fff9ec;
            }
            .gal-exit {
                position: absolute;
                right: calc(var(--s) * 9px);
                top: calc(var(--s) * -8px);
                padding: calc(var(--s) * 2px) calc(var(--s) * 6px);
                font-family: var(--font);
                font-weight: 700;
                font-size: calc(var(--s) * 7.4px);
                letter-spacing: 0.03em;
                color: #8a5a3a;
                background: #ffe9b8;
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow: 0 0 0 calc(var(--s) * 2px) #fff9ec;
                cursor: pointer;
                pointer-events: auto;
                transition:
                    background 0.12s ease,
                    transform 0.12s ease;
            }
            .gal-exit:hover {
                background: #ffd98a;
                transform: translateY(calc(var(--s) * -1px));
            }

            .gal-text {
                white-space: pre-line;   /* 允许文案里用 \n 换行 */
                font-size: calc(var(--s) * 14px);
                line-height: 1.62;
                letter-spacing: 0.01em;
                color: #40382d;
                text-shadow: 0 calc(var(--s) * 0.5px) 0
                    rgba(255, 255, 255, 0.85);
            }
            .gal-foot {
                position: absolute;
                left: calc(var(--s) * 10px);
                right: calc(var(--s) * 10px);
                bottom: calc(var(--s) * 6px);
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: calc(var(--s) * 5.6px);
                font-weight: 600;
                color: #9a8b76;
            }
            .gal-skip {
                opacity: 0;
                transition: opacity 0.2s ease;
            }
            .gal-skip.on {
                opacity: 1;
                animation: blink 1s steps(1, end) infinite;
            }

            /* ---------- 提问选项按钮 ---------- */
            .gal-options {
                position: absolute;
                left: 5%;
                right: 5%;
                top: calc(var(--s) * 244px);
                height: calc(var(--s) * 104px);
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-auto-rows: 1fr;
                gap: calc(var(--s) * 4px) calc(var(--s) * 4px);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease;
            }
            #gal.opts .gal-options {
                opacity: 1;
                pointer-events: auto;
            }

            .gal-opt {
                display: flex;
                align-items: center;
                gap: calc(var(--s) * 3px);
                padding: 0 calc(var(--s) * 5px);
                font-family: var(--font);
                font-weight: 700;
                letter-spacing: 0.02em;
                font-size: calc(var(--s) * 7px);
                color: #3a3229;
                text-align: left;
                white-space: nowrap;
                overflow: hidden;
                background: #fffdf5;
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow: calc(var(--s) * 1px) calc(var(--s) * 2px) 0
                    rgba(75, 64, 52, 0.16);
                cursor: pointer;
                pointer-events: auto;
                transition:
                    background 0.12s ease,
                    transform 0.1s ease;
            }
            .gal-opt .num {
                flex: none;
                color: #c07a3a;
            }
            .gal-opt .qt {
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .gal-opt:hover,
            .gal-opt.sel {
                background: #ffeeb8;
                transform: translateX(calc(var(--s) * 2px));
            }
            .gal-opt.done {
                background: #f0f8ee;
            }
            .gal-opt.done::after {
                content: "✓";
                margin-left: auto;
                padding-left: calc(var(--s) * 3px);
                color: #4f9e6a;
                flex: none;
            }

            /* =====================================================================
   活动展板：其余 NPC 的群像背景（纯 CSS 绘制，可点击查看照片）
   —— 展板整体位于人物头顶以上的区域，不会遮住角色
   ===================================================================== */
            #booths {
                position: absolute;
                inset: 0;
            }

            .booth {
                position: absolute;
                left: 0;
                top: 0;
                width: calc(var(--s) * 280px);
                height: calc(var(--s) * 108px);
                transform: translate(-50%, -100%) scale(0.94);
                opacity: 0;
                pointer-events: none;
                transition:
                    opacity 0.35s ease,
                    transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
            }
            .booth.on {
                opacity: 1;
                pointer-events: auto;
                cursor: pointer;
                transform: translate(-50%, -100%) scale(1);
            }

            .booth-frame {
                position: absolute;
                inset: 0;
                background: #fff9ec;
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow:
                    0 0 0 calc(var(--s) * 2px) #fffdf7,
                    0 0 0 calc(var(--s) * 3px) #4b4034,
                    0 calc(var(--s) * 6px) calc(var(--s) * 14px)
                        rgba(52, 72, 44, 0.2);
                overflow: hidden;
                transition: transform 0.14s ease;
            }
            .booth:hover .booth-frame {
                transform: translateY(calc(var(--s) * -3px));
            }

            /* 场景区：1em = 2 逻辑像素，所有元素用 em 定位，缩放时保持像素硬边 */
            .booth-scene {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: calc(var(--s) * 92px);
                font-size: calc(var(--s) * 2px);
                overflow: hidden;
            }
            .booth-px {
                position: absolute;
            }

            .booth-cap {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: calc(var(--s) * 16px);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 calc(var(--s) * 5px);
                font-size: calc(var(--s) * 4.6px);
                color: #3a3229;
                background: #ffeec8;
                border-top: calc(var(--s) * 1px) solid #4b4034;
            }
            .booth-cap .tip {
                color: #a8763a;
                font-size: calc(var(--s) * 4.2px);
            }

            /* =====================================================================
   照片画框（点击展板后弹出）
   ===================================================================== */
            #photo {
                position: absolute;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                background: rgba(38, 48, 40, 0.58);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.22s ease;

            #photo.on {
                display: flex;
            }
            #photo.show {
                opacity: 1;
                pointer-events: auto;
                cursor: pointer;

            .photo-card {
                /* 卡片宽度贴合相框，不再留出大片空白 */
                width: fit-content;
                max-width: 92%;
                padding: calc(var(--s) * 8px);
                display: flex;
                flex-direction: column;
                gap: calc(var(--s) * 5px);
            }
            .photo-head {
                display: flex;
                align-items: baseline;

            }
            .photo-head .t {
                font-size: calc(var(--s) * 6px);

            }
            .photo-head .x {
                font-size: calc(var(--s) * 4.2px);

            }
            .photo-frame {
                position: relative;
                /* 默认按 4:3 显示；图片加载后由脚本按真实宽高比精确贴合 */
                width: calc(var(--s) * 344px);
                height: calc(var(--s) * 258px);
                margin: 0 auto;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                background: #f4f1e8;
                border: calc(var(--s) * 1px) solid #4b4034;
                box-shadow: inset 0 0 0 calc(var(--s) * 2px) #fffdf7;
            }
            .photo-frame img {
                width: 100%;
                height: 100%;
                object-fit: contain;   /* 相框已按比例贴合，图片正好铺满 */
                display: block;
                image-rendering: auto;
            }
            /* 图片尚未放入时的占位提示 */
            .photo-hold {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: calc(var(--s) * 4px);
                text-align: center;
                color: #8a8072;
            }
            .photo-hold .ph1 {
                font-size: calc(var(--s) * 5.4px);
                color: #6b7f6f;
            }
            .photo-hold .ph2 {
                font-size: calc(var(--s) * 5.6px);
                color: #c0653a;
                padding: calc(var(--s) * 2px) calc(var(--s) * 6px);
                border: calc(var(--s) * 1px) dashed #c0a98a;
                background: #fffdf6;
            }
            .photo-hold .ph3 {
                font-size: calc(var(--s) * 4px);
                color: #a09a8c;
            }
            .photo-hold.hide {
                display: none;
            }

            /* =====================================================================
   结局彩蛋
   ===================================================================== */
            #ending {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transition: opacity 0.8s ease;
                overflow: hidden;
            }
            #ending.show {
                opacity: 1;
            }

            /* 淡入高光：文字后方的柔和暖晕（不再把整张黄昏画面冲白） */
            .end-glow {
                position: absolute;
                inset: -20%;
                background: radial-gradient(
                    58% 52% at 50% 46%,
                    rgba(255, 252, 238, 0.74) 0%,
                    rgba(255, 246, 222, 0.4) 46%,
                    rgba(255, 240, 210, 0) 100%
                );
                transform: scale(0.4);
                opacity: 0;
                animation: glowIn 2.2s cubic-bezier(0.2, 0.8, 0.3, 1) 0.15s
                    forwards;
            }
            @keyframes glowIn {
                0% {
                    transform: scale(0.4);
                    opacity: 0;
                }
                45% {
                    transform: scale(1.02);
                    opacity: 1;
                }
                100% {
                    transform: scale(1.12);
                    opacity: 0.92;
                }
            }

            .end-card {
                position: relative;
                text-align: center;
                padding: calc(var(--s) * 14px) calc(var(--s) * 24px);
                overflow: hidden;
                transform: translateY(calc(var(--s) * 10px));
                animation: cardIn 0.9s cubic-bezier(0.2, 0.9, 0.25, 1) 0.35s
                    forwards;
            }
            @keyframes cardIn {
                from {
                    transform: translateY(calc(var(--s) * 14px)) scale(0.96);
                    opacity: 0;
                }
                to {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
            }
            /* 扫过的高光条 */
            .end-card::after {
                content: "";
                position: absolute;
                top: -60%;
                bottom: -60%;
                left: -40%;
                width: 34%;
                background: linear-gradient(
                    100deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.85) 50%,
                    rgba(255, 255, 255, 0) 100%
                );
                transform: translateX(-160%) rotate(8deg);
                animation: sweep 2.4s ease-in-out 1.5s forwards;
                pointer-events: none;
            }
            @keyframes sweep {
                0% {
                    transform: translateX(-160%) rotate(8deg);
                    opacity: 0;
                }
                15% {
                    opacity: 1;
                }
                100% {
                    transform: translateX(560%) rotate(8deg);
                    opacity: 0;
                }
            }

            .end-line {
                opacity: 0;
                animation: lineIn 0.75s ease-out forwards;
            }
            @keyframes lineIn {
                from {
                    opacity: 0;
                    transform: translateY(calc(var(--s) * 5px));
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .end-line.l1 {
                font-size: calc(var(--s) * 15px);
                color: #35443a;
                letter-spacing: 0.08em;
                text-shadow:
                    calc(var(--s) * 1px) calc(var(--s) * 1px) 0 #fff,
                    calc(var(--s) * 2px) calc(var(--s) * 2px) 0 #d8ecd8;

            }
            .end-line.l2 {
                margin-top: calc(var(--s) * 9px);
                font-size: calc(var(--s) * 10.5px);

                letter-spacing: 0.06em;
                animation-delay: 1.05s;
            }
            .end-line.l3 {
                margin-top: calc(var(--s) * 6px);
                font-size: calc(var(--s) * 7.6px);
                color: #b06a7e;
                letter-spacing: 0.18em;
                animation-delay: 1.75s;
            }
            .end-line.l4 {
                margin-top: calc(var(--s) * 5px);
                font-size: calc(var(--s) * 8.4px);
                color: #5c7a66;
                letter-spacing: 0.1em;
                animation-delay: 2.35s;
            }
            .end-hint {
                margin-top: calc(var(--s) * 16px);
                font-size: calc(var(--s) * 4.4px);
                color: #a09a8c;

            }

            /* =====================================================================
   画面四角轻微暗角，让投影画面更聚焦（纯 CSS，无外部资源）
   ===================================================================== */
            #vignette {
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    120% 100% at 50% 45%,
                    rgba(0, 0, 0, 0) 55%,
                    rgba(40, 55, 40, 0.16) 100%
                );
            }

            /* =====================================================================
   移动端触控按钮：像素风外观，与游戏同一套视觉
   —— 尺寸用固定 px/clamp（不随画布 --s 缩放），保证手指可点
   —— 仅在触摸设备上显示，投影与桌面端保持干净
   ===================================================================== */
            #touch {
                position: fixed;
                inset: 0;
                display: none;
                pointer-events: none; /* 只有按钮可点，其余穿透 */
                z-index: 20;
                font-family: var(--font);
                font-weight: 700;
                --tb: clamp(54px, 13.5vw, 86px); /* 按钮边长 */
            }
            .tc-pad {
                position: absolute;
                bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
                display: none;
                gap: 14px;
                align-items: center;
            }
            .tc-pad.on {
                display: flex;
            }
            .tc-move {
                left: calc(env(safe-area-inset-left, 0px) + 14px);
            }
            .tc-act {
                right: calc(env(safe-area-inset-right, 0px) + 14px);
            }
            .tc-again {
                left: 50%;
                transform: translateX(-50%);
            }
            .tc-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: var(--tb);
                height: var(--tb);
                font-family: var(--font);
                font-weight: 700;
                font-size: calc(var(--tb) * 0.4);
                line-height: 1;
                color: #3a3229;
                background: #fff9ec;
                border: 3px solid #4b4034;
                border-radius: 6px;
                box-shadow:
                    0 0 0 3px #fffdf7,
                    0 5px 0 rgba(75, 64, 52, 0.28);
                cursor: pointer;
                pointer-events: auto;
                touch-action: none; /* 阻止滚动与双击缩放 */
                user-select: none;
                -webkit-user-select: none;
                -webkit-tap-highlight-color: transparent;
                transition:
                    background 0.1s ease,
                    transform 0.06s ease;
            }
            .tc-btn:active {
                background: #ffeeb8;
                transform: translateY(3px);
                box-shadow:
                    0 0 0 3px #fffdf7,
                    0 2px 0 rgba(75, 64, 52, 0.28);
            }
            .tc-wide {
                width: calc(var(--tb) * 1.85);
                font-size: calc(var(--tb) * 0.3);
                letter-spacing: 0.1em;
            }

            .tc-rotate {
                position: absolute;
                left: 50%;
                bottom: calc(env(safe-area-inset-bottom, 0px) + 14px + var(--tb) + 18px);
                transform: translateX(-50%);
                padding: 9px 16px;
                font-family: var(--font);
                font-weight: 700;
                font-size: 14px;
                letter-spacing: 0.06em;
                white-space: nowrap;
                color: #3a3229;
                background: #fff9ec;
                border: 3px solid #4b4034;
                border-radius: 6px;
                box-shadow:
                    0 0 0 3px #fffdf7,
                    0 5px 0 rgba(75, 64, 52, 0.28);
                display: none;
            }
            /* 仅触摸设备 + 竖屏时提示横屏（转过屏幕即自动消失） */
            @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
                .tc-rotate {
                    display: block;
                }
            }
            /* 触摸设备：显示触控按钮，并隐藏只对键盘有意义的提示 */
            @media (hover: none) and (pointer: coarse) {
                #touch {
                    display: block;
                }
                .hud-chip.keys {
                    display: none;
                }
                .gal-foot > span:first-child {
                    display: none;
                }
                .end-hint {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <!-- ===================== 游戏画布 ===================== -->
        <canvas id="game" width="640" height="360"></canvas>

        <!-- ===================== UI 覆盖层 ===================== -->
        <div id="ui">
            <div id="vignette"></div>
            <div id="tags"></div>
            <div id="booths"></div>

            <!-- 顶部状态栏（标题页隐藏，开始探索后再出现） -->
            <div id="hud" style="opacity: 0">
                <div class="hud-left">
                    <!-- 触控按钮开关：桌面端也能切出按钮来做演示 -->
                    <button
                        id="touch-toggle"

                        aria-pressed="false"
                        title="显示 / 隐藏触控按钮"
                    >
                        <span>按钮</span><b id="touch-state">关</b>
                    </button>
                    <div class="hud-chip">
                        <span>探索进度</span>

                        <span class="pips" id="hud-pips"></span>
                    </div>
                </div>
                <div class="hud-chip keys">

                </div>
            </div>

            <!-- 对话框 -->
            <div id="dialog" class="pxpanel">
                <div id="dlg-name">学姐</div>
                <div id="dlg-text"></div>
                <div id="dlg-hint">
                    按 <b>空格</b> 继续 <span class="arrow">▼</span>
                </div>
            </div>

            <!-- ============ Galgame 问答界面（组织部部长） ============ -->
            <div id="gal">
                <!-- 角色立绘占位框：像素立绘完全由 CSS 的 box-shadow 拼出 -->
                <div class="gal-figure">
                    <div class="gal-px" id="gal-px"></div>
                </div>
                <div class="gal-figure-cap">组织部部长 ~ 张怀志</div>

                <!-- 对话框：左侧角色名，右侧结束提问 -->
                <div class="gal-dialog pxpanel" id="gal-dialog">
                    <div class="gal-nameplate" id="gal-name">组织部部长</div>
                    <button class="gal-exit" id="gal-exit" type="button">
                        结束提问，继续探索 →
                    </button>
                    <div class="gal-text" id="gal-text"></div>
                    <div class="gal-foot">
                        <span>↑ ↓ 选择问题　Enter 确认　也可直接点击选项</span>
                        <span class="gal-skip" id="gal-skip">点击文字可跳过 ▼</span>
                    </div>
                </div>

                <!-- 玩家可点击的提问选项（位于对话框下方，与原来一致） -->
                <div class="gal-options" id="gal-options"></div>
            </div>

            <!-- 照片画框：点击活动展板后弹出 -->
            <div id="photo">
                <div class="photo-card pxpanel">
                    <div class="photo-head">
                        <span class="t" id="photo-title">辩论赛</span>
                        <span class="x">点击任意位置 / 按空格 关闭</span>
                    </div>
                    <div class="photo-frame" id="photo-frame">
                        <img id="photo-img" alt="" />
                        <div class="photo-hold" id="photo-hold">
                            <div class="ph1">照片占位</div>
                            <div class="ph2" id="photo-file">
                                photo-debate.jpg
                            </div>
                            <div class="ph3">
                                把这张图片放到与本网页相同的目录，刷新即可显示
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 标题页 -->
            <div id="title">
                <div class="title-card">
                    <div class="t-sub">像素校园探索</div>
                    <div class="t-main">社联组织部</div>
                    <div class="t-line">以细致立身 · 以统筹成事</div>
                    <div class="t-keys">← → 左右移动　·　空格 关闭对话</div>
                    <div class="t-start">按 空格 键 开始探索</div>
                </div>
            </div>

            <!-- 结局彩蛋 -->
            <div id="ending">
                <div class="end-glow"></div>
                <div class="end-card">
                    <div class="end-line l1">探索完成！</div>
                    <div class="end-line l2">欢迎加入 社联组织部</div>
                    <div class="end-line l3">以细致立身，以统筹成事</div>
                    <div class="end-line l4">我们在这里等你相遇！</div>
                    <div class="end-hint">按 R 键 重新开始探索</div>
                </div>
            </div>
        </div>

        <!-- ============ 移动端触控按钮（仅触摸设备显示） ============ -->
        <div id="touch">
            <div class="tc-pad tc-move">
                <button class="tc-btn" type="button" data-key="ArrowLeft" aria-label="向左走">◀</button>
                <button class="tc-btn" type="button" data-key="ArrowRight" aria-label="向右走">▶</button>
            </div>
            <div class="tc-pad tc-act">
                <button class="tc-btn tc-wide" type="button" data-key="Space" id="tc-action">继 续</button>
            </div>
            <div class="tc-rotate">建议横屏使用，画面更大更好点</div>
            <div class="tc-pad tc-again">
                <button class="tc-btn tc-wide" type="button" data-key="KeyR">重新开始</button>
            </div>
        </div>
        <script>
            "use strict";

            /* 禁用长按选中、右键菜单与拖拽：演示时不需要浏览器默认交互 */
            ["contextmenu", "selectstart", "dragstart"].forEach(function (type) {
                document.addEventListener(type, function (e) {
                    e.preventDefault();
                });
            });
            /* =====================================================================
   像素校园 · 社联组织部招新探索
   单文件 / 纯前端 / 无外部资源 / 双击即可运行
   ---------------------------------------------------------------------
   目录：
     1. 基础常量
     2. 工具函数
     3. 音效引擎（Web Audio 实时合成，无音频文件）
     4. 剧情文案与 NPC 数据
     5. 角色与景物绘制
     6. 场景预渲染（草地 / 装饰物）
     7. 游戏状态
     8. 更新逻辑
     9. 渲染
    10. Galgame 问答界面（组织部部长）
    11. 活动展板（群像背景）与照片画框
    12. 输入、界面联动与主循环
   ===================================================================== */
            (function () {
                /* =====================================================================
   1. 基础常量
   ===================================================================== */
                const VW = 640; // 逻辑分辨率宽
                const VH = 360; // 逻辑分辨率高
                const HORIZON = 228; // 地平线 y
                const GROUND_Y = 306; // 人物脚底基线 y
                const WORLD_W = 4600; // 世界总宽度（超长横向地图）
                const END_TRIGGER_X = 4380; // 抵达终点的触发横坐标
                const PLAYER_MIN_X = 40;
                const PLAYER_MAX_X = 4520;
                const SPEED = 175; // 最大移动速度（逻辑像素/秒）
                const ACCEL = 980; // 加速度（起步更干脆）
                const FRICTION = 1900; // 松手后的减速
                const CHAR_SCALE = 2; // 人物整体放大倍数（投影时看得清）
                const NPC_TRIGGER = 70; // 自动触发对话的距离
                const NPC_RELEASE = 116; // 离开该距离后可重新触发
                const WALK_FRAME_TIME = 0.1; // 每帧走路动画时长（与移动速度同步加快，避免脚下打滑）
                const STEP_INTERVAL = 0.2; // 脚步声间隔

                /* =====================================================================
   2. 工具函数
   ===================================================================== */
                const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

                /** 像素风矩形：坐标取整，保证边缘硬朗 */
                function rect(g, x, y, w, h, color) {
                    g.fillStyle = color;
                    g.fillRect(
                        Math.round(x),
                        Math.round(y),
                        Math.round(w),
                        Math.round(h),
                    );
                }

                /** 像素风实心圆（逐行扫描，天然带阶梯感） */
                function pixelCircle(g, cx, cy, r, color) {
                    g.fillStyle = color;
                    for (let y = -r; y <= r; y++) {
                        const w = Math.floor(Math.sqrt(r * r - y * y));
                        g.fillRect(
                            Math.round(cx - w),
                            Math.round(cy + y),
                            w * 2 + 1,
                            1,
                        );
                    }
                }

                /** 可复现随机数（保证每次打开场景布局一致） */
                function mulberry32(seed) {
                    let a = seed >>> 0;
                    return function () {
                        a = (a + 0x6d2b79f5) >>> 0;
                        let t = Math.imul(a ^ (a >>> 15), 1 | a);
                        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                    };
                }

                /** 颜色加深 / 提亮：amt 为负变暗，为正变亮 */
                function shade(hex, amt) {
                    const n = parseInt(hex.slice(1), 16);
                    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(
                        (v) =>
                            Math.max(
                                0,
                                Math.min(255, Math.round(v * (1 + amt))),
                            ),
                    );
                    return (
                        "#" +
                        c.map((v) => v.toString(16).padStart(2, "0")).join("")
                    );
                }

                /** 像素风圆角面板（用于提示气泡） */
                function pxPanel(g, x, y, w, h, fill, edge) {
                    rect(g, x + 1, y, w - 2, h, edge);
                    rect(g, x, y + 1, w, h - 2, edge);
                    rect(g, x + 2, y + 1, w - 4, h - 2, fill);
                    rect(g, x + 1, y + 2, w - 2, h - 4, fill);
                }

                /* =====================================================================
   3. 音效引擎
   —— 全部使用 Web Audio 实时合成，不加载任何音频文件
   ===================================================================== */
                const Sound = (function () {
                    let ctx = null,
                        master = null,
                        noiseBuf = null,
                        bgmGain = null;
                    let bgmOn = false,
                        bgmTimer = null;

                    /** 首次用户交互时初始化音频上下文 */
                    function init() {
                        if (ctx) {
                            if (ctx.state === "suspended") ctx.resume();
                            return;
                        }
                        const AC =
                            window.AudioContext || window.webkitAudioContext;
                        if (!AC) return;
                        ctx = new AC();
                        master = ctx.createGain();
                        master.gain.value = 0.85;
                        master.connect(ctx.destination);

                        // 预生成一段白噪声，用于脚步等摩擦音
                        const len = Math.floor(ctx.sampleRate * 0.4);
                        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
                        const data = noiseBuf.getChannelData(0);
                        for (let i = 0; i < len; i++)
                            data[i] = Math.random() * 2 - 1;
                    }

                    /** 在指定「绝对时间」上播放一个合成音（方波 = 复古 8bit 音色） */
                    function toneAt(freq, dur, type, vol, t0, glideTo, dest) {
                        if (!ctx) return;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = type || "square";
                        osc.frequency.setValueAtTime(freq, t0);
                        if (glideTo)
                            osc.frequency.linearRampToValueAtTime(
                                glideTo,
                                t0 + dur,
                            );
                        g.gain.setValueAtTime(0.0001, t0);
                        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
                        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                        osc.connect(g);
                        g.connect(dest || master);
                        osc.start(t0);
                        osc.stop(t0 + dur + 0.03);
                    }

                    /** 相对当前时间播放（delay 单位：秒） */
                    function tone(freq, dur, type, vol, delay, glideTo, dest) {
                        if (!ctx) return;
                        toneAt(
                            freq,
                            dur,
                            type,
                            vol,
                            ctx.currentTime + (delay || 0),
                            glideTo,
                            dest,
                        );
                    }

                    /** 噪声脉冲（脚步踩在草地上的轻响） */
                    function noiseHit(freq, dur, vol) {
                        if (!ctx || !noiseBuf) return;
                        const t0 = ctx.currentTime;
                        const src = ctx.createBufferSource();
                        src.buffer = noiseBuf;
                        const bp = ctx.createBiquadFilter();
                        bp.type = "bandpass";
                        bp.frequency.value = freq;
                        bp.Q.value = 1.1;
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.0001, t0);
                        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
                        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                        src.connect(bp);
                        bp.connect(g);
                        g.connect(master);
                        src.start(t0);
                        src.stop(t0 + dur + 0.02);
                    }

                    /* ---------- 对外音效接口 ---------- */

                    /** 轻脚步：噪声 + 极轻的低频，左右脚音高略有差异 */
                    let stepFlip = false;
                    function step() {
                        stepFlip = !stepFlip;
                        noiseHit(stepFlip ? 900 : 1120, 0.07, 0.055);
                        tone(stepFlip ? 150 : 178, 0.05, "sine", 0.035);
                    }

                    /** 开始探索的轻快小提示 */
                    function start() {
                        tone(523.25, 0.09, "square", 0.1, 0);
                        tone(659.25, 0.09, "square", 0.1, 0.08);
                        tone(783.99, 0.2, "square", 0.11, 0.16);
                    }

                    /** 触发对话：两段上行音 */
                    function talk() {
                        tone(659.25, 0.07, "square", 0.1, 0);
                        tone(987.77, 0.1, "square", 0.085, 0.075);
                    }

                    function close() {

                        tone(587.33, 0.11, "square", 0.08, 0.07);
                    }

                    /** 抵达终点的彩蛋音效：上行琶音 + 明亮和弦 + 高音闪光 */
                    function ending() {
                        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
                        notes.forEach((f, i) =>
                            tone(f, 0.22, "triangle", 0.12, i * 0.13),
                        );
                        // 收尾和弦
                        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                            tone(f, 1.5, "triangle", 0.075, 0.72 + i * 0.015);
                        });
                        // 高音闪光
                        [1567.98, 2093.0].forEach((f, i) =>
                            tone(f, 0.5, "square", 0.035, 1.25 + i * 0.12),
                        );
                    }

                    /* ---------- 背景音乐：4 小节循环的柔和八音盒 ---------- */
                    const BGM_PROG = [
                        { bass: 130.81, arp: [261.63, 329.63, 392.0, 523.25] }, // C
                        { bass: 110.0, arp: [220.0, 261.63, 329.63, 440.0] }, // Am
                        { bass: 87.31, arp: [174.61, 220.0, 261.63, 349.23] }, // F
                        { bass: 98.0, arp: [196.0, 246.94, 293.66, 392.0] }, // G
                    ];
                    const BAR_TIME = 1.04; // 每小节时长
                    const LOOP_TIME = BAR_TIME * BGM_PROG.length;

                    function scheduleLoop() {
                        if (!ctx || !bgmOn) return;
                        const t0 = ctx.currentTime + 0.08;
                        BGM_PROG.forEach((bar, bi) => {
                            const bt = t0 + bi * BAR_TIME;
                            // 低音铺底
                            toneAt(
                                bar.bass,
                                BAR_TIME * 0.9,
                                "triangle",
                                0.05,
                                bt,
                                null,
                                bgmGain,
                            );
                            // 琶音旋律
                            bar.arp.forEach((f, i) => {
                                toneAt(
                                    f,
                                    0.5,
                                    "triangle",
                                    0.032,
                                    bt + i * (BAR_TIME / 4),
                                    null,
                                    bgmGain,
                                );
                            });
                        });
                        bgmTimer = setTimeout(scheduleLoop, LOOP_TIME * 1000);
                    }

                    function bgmToggle() {
                        if (!ctx) return false;
                        bgmOn = !bgmOn;
                        if (bgmOn) {
                            bgmGain.gain.setTargetAtTime(
                                1,
                                ctx.currentTime,
                                0.4,
                            );
                            scheduleLoop();
                        } else {
                            bgmGain.gain.setTargetAtTime(
                                0,
                                ctx.currentTime,
                                0.3,
                            );
                            clearTimeout(bgmTimer);
                            bgmTimer = null;
                        }
                        return bgmOn;
                    }

                    /** 对话时压低背景音乐音量 */
                    function bgmDuck(ducked) {
                        if (!ctx || !bgmOn) return;
                        bgmGain.gain.setTargetAtTime(
                            ducked ? 0.34 : 1,
                            ctx.currentTime,
                            0.15,
                        );
                    }

                    function ready() {
                        if (!ctx) return;
                        if (!bgmGain) {
                            bgmGain = ctx.createGain();
                            bgmGain.gain.value = 0;
                            bgmGain.connect(master);
                        }
                    }

                    /** 浏览器切页后可能挂起音频，任何按键都顺手唤醒一次 */
                    function resume() {
                        if (ctx && ctx.state === "suspended") ctx.resume();
                    }

                    return {
                        init,
                        ready,
                        resume,
                        step,
                        start,
                        talk,
                        close,
                        ending,
                        bgmToggle,
                        bgmDuck,
                        get bgmOn() {
                            return bgmOn;
                        },
                        get ok() {
                            return !!ctx;
                        },
                    };
